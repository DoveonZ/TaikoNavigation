                        style: parseInt(row[4]) || 1
                    }));
                }
                return sections.filter(function(section) {
                    return section.links.length > 0 || section.title;
                });
            }

            /* 万一 vendor/ 那份丢了（比如只把 index.html 拷走），再去 CDN 兜一次底。
               拿不到就返回 false，交给下面给出准确的报错，而不是让 XLSX is not defined 蒙混过去。 */
            const XLSX_CDN_FALLBACK = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
            let xlsxFallbackPromise = null;
            function ensureXLSX() {
                if (typeof XLSX !== 'undefined') return Promise.resolve(true);
                if (xlsxFallbackPromise) return xlsxFallbackPromise;
                xlsxFallbackPromise = new Promise(function(resolve) {
                    const s = document.createElement('script');
                    s.src = XLSX_CDN_FALLBACK;
                    s.onload = function() { resolve(typeof XLSX !== 'undefined'); };
                    s.onerror = function() { resolve(false); };
                    document.head.appendChild(s);
                });
                return xlsxFallbackPromise;
            }

            /* 读取 data.xlsx 的全部工作表 */
            (async function loadData() {
                let failure = null;
                try {
                    if (!(await ensureXLSX())) {
                        failure = '解析库没加载出来，读不了 xlsx。请确认 vendor/xlsx.full.min.js 还在，' +
                                  '或者能连上 cdn.jsdelivr.net。';
                    } else {
                        const response = await fetch('data.xlsx');
                        if (!response.ok) {
                            failure = '请求 data.xlsx 失败（HTTP ' + response.status +
                                      '）。请确认该文件与 index.html 位于同一目录。';
                        } else {
                            const arrayBuffer = await response.arrayBuffer();
                            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                            workbook.SheetNames.forEach(function(sheetName) {
                                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
                                sheets.push({ name: sheetName, sections: parseSections(rows) });
                            });
                            const fromHash = sheets.findIndex(function(sheet) { return sheet.name === currentHashName(); });
                            activeSheet = fromHash >= 0 ? fromHash : 0;
                        }
                    }
                } catch (e) {
                    console.error('加载 data.xlsx 出错', e);
                    failure = '读取 data.xlsx 出错：' + (e && e.message ? e.message : e);
                }
                if (failure) {
                    loadError = failure;
                    console.error('[TaikoNavigation] ' + failure);
                }
                renderTabs();
                renderAll();
            })();

            const tabBar = document.getElementById('sheetTabs');
            if (tabBar) {
                tabBar.addEventListener('click', function(e) {
                    const btn = e.target.closest ? e.target.closest('.sheet-tab') : null;
                    if (!btn) return;
                    activateSheet(parseInt(btn.getAttribute('data-index'), 10), true);
                });
                tabBar.addEventListener('keydown', function(e) {
                    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                    if (!sheets.length) return;
                    e.preventDefault();
                    const step = e.key === 'ArrowRight' ? 1 : -1;
                    const next = (activeSheet + step + sheets.length) % sheets.length;
                    activateSheet(next, true);
                    const btn = tabBar.querySelector('.sheet-tab[data-index="' + next + '"]');
                    if (btn) btn.focus();
                });
            }

            window.addEventListener('hashchange', function() {
                const index = sheets.findIndex(function(sheet) { return sheet.name === currentHashName(); });
                if (index >= 0 && index !== activeSheet) activateSheet(index, false);
            });

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(function() {
                    const isMobile = window.innerWidth <= 768;
                    if (isMobile !== lastIsMobile) renderAll();   // 行列数变化，需要重绘
                    else updateMobileScale();
                    updateModalScale();                           // 弹窗打开时同步跟随窗口变化
                }, 250);
            });

            document.addEventListener('error', function(e) {
                if (e.target && e.target.tagName === 'IMG' && e.target.closest('.icon-circle')) {
                    e.target.style.display = 'none';
                }
            }, true);

            /* ========== 调试接口 ==========
               供文件末尾的 Ctrl+Shift+P 调试面板读写偏移量表；正常浏览时不会被调用。 */
            window.TAIKO_ICON_DEBUG = {
                storageKey: ICON_OFFSET_STORAGE_KEY,
                styleCount: 6,
                defaults: DEFAULT_ICON_OFFSETS,
                mode: iconOffsetMode,
                get: function() { return iconOffsets; },
                apply: applyIconOffsets,
                save: saveIconOffsets,
                /* 在指定模式下把某个样式再挪动 (ddx, ddy)，返回调整后的值 */
                nudge: function(mode, index, ddx, ddy) {
                    const list = iconOffsets[mode];
                    const item = list ? list[index] : null;
                    if (!item) return null;
                    item.dx = normalizeOffset(item.dx + ddx, item.dx);
                    item.dy = normalizeOffset(item.dy + ddy, item.dy);
                    return item;
                },
                /* index 为 null / undefined 时重置该模式下的全部样式 */
                reset: function(mode, index) {
                    if (!iconOffsets[mode]) return;
                    if (index === null || index === undefined) {
                        iconOffsets[mode] = cloneOffsetList(DEFAULT_ICON_OFFSETS[mode]);
                        return;
                    }
                    const src = DEFAULT_ICON_OFFSETS[mode][index];
                    if (!src) return;
                    iconOffsets[mode][index] = { dx: src.dx, dy: src.dy };
                }
            };
        })();
    </script>

    <script>
        /* ==========================================================================
           图标偏移调试工具（校准用；随 index.html 一起加载，未开启时不介入任何渲染）

           开启 / 关闭：
             · Ctrl + Shift + P     —— 焦点要在页面上（不要点在 DevTools 里，那里会打开命令菜单）
             · 网址后加 ?icondebug=1 —— 快捷键被系统/浏览器占用时的备用入口

           键位：
             1 ~ 6           切换要校准的底板种类 .plate.style-1 ~ .plate.style-6
             ↑ ↓ ← →         按 0.1px 微调图标坐标（单位 = 底板基准像素）
             Shift + 方向键   1px 粗调          Ctrl + 方向键   0.01px 极细调
             Z 放大镜倍数   M 平滑/像素采样   T 图标半透明   H 压暗其它种类
             O 输出结果（控制台 + 面板 + 尝试复制）      R 重置当前种类（Shift+R 重置本模式全部）
             U 撤销上一次重置      Esc 关闭面板

           怎么用：
             面板里的放大镜把选中的底板样式放大若干倍，品红线是图标圆外框、青线是它的中心，
             对照底板贴图里凹槽的位置按方向键挪到对齐为止，再按 O 输出。
             输出里的 mobile / pc 数组就是写完要替换进 index.html 中 DEFAULT_ICON_OFFSETS 的内容。
             调试数值会缓存在 localStorage（键名 taiko.iconOffsets.v1），按 R 可还原；
             写回文件后可按输出末尾提示的那行 removeItem 清掉缓存。
           ========================================================================== */
        (function() {
            'use strict';

            const BRIDGE = window.TAIKO_ICON_DEBUG;
            if (!BRIDGE) return;
            const MODAL_BRIDGE = window.TAIKO_MODAL_DEBUG;   // 可能不存在（老页面），下面都做空值保护

            const STYLE_COUNT = BRIDGE.styleCount || 6;
            const ZOOMS = [3, 6, 10, 16];
            const MODE_LABEL = { pc: 'PC 端', mobile: '移动端' };
            const STEP_NORMAL = 0.1;
            const STEP_COARSE = 1;
            const STEP_FINE = 0.01;
            const LOUPE_INTERVAL = 60;   // 放大镜刷新间隔(ms)
            const SPEED_PRESETS = [0.5, 0.75, 1, 1.5, 2, 3];   // 弹窗动画速度倍率预设

            const state = {
                on: false,
                styleIndex: 0,
                zoomIndex: 1,
                smooth: true,
                ghost: false,
                dim: true,
                hasOutput: false
            };

            let panel = null;
            let canvas = null;
            let ctx = null;
            let rowMode = null;
            let rowStyle = null;
            let rowValue = null;
            let rowDefault = null;
            let rowSpeed = null;
            let statusEl = null;
            let outWrap = null;
            let outArea = null;
            let loupeHint = null;
            let probeHost = null;
            let probeStyle = -1;
            let sprite = null;
            let rafId = 0;
            let lastDraw = 0;
            let statusTimer = 0;
            let sampleIsProbe = false;
            let observer = null;
            let undoSnapshot = null;   // 最近一次"重置"之前的数值，按 U 恢复

            /* ---------------- 取值与格式化 ---------------- */

            function mode() { return BRIDGE.mode(); }
            function offsetsOf(m) { return BRIDGE.get()[m]; }
            function currentOffset() { return offsetsOf(mode())[state.styleIndex]; }
            function defaultsOf(m) { return BRIDGE.defaults[m]; }

            function isDirty(m, index) {
                const item = offsetsOf(m)[index];
                const base = defaultsOf(m)[index];
                return Math.abs(item.dx - base.dx) > 1e-4 || Math.abs(item.dy - base.dy) > 1e-4;
            }

            function currentScale() {
                const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scale'));
                return (isFinite(value) && value > 0) ? value : 1;
            }

            function trim(value) {
                return String(Math.round(value * 100) / 100);
            }

            function signed(value, digits) {
                const d = (digits === undefined) ? 2 : digits;
                return (value > 0 ? '+' : '') + value.toFixed(d);
            }

            function setStatus(msg) {
                if (!statusEl) return;
                statusEl.textContent = msg;
                statusEl.classList.add('show');
                clearTimeout(statusTimer);
                statusTimer = setTimeout(function() { statusEl.classList.remove('show'); }, 3000);
            }

            function isEditableTarget() {
                const el = document.activeElement;
                if (!el) return false;
                if (el.tagName === 'INPUT') return true;
                if (el.tagName === 'TEXTAREA') return el.readOnly !== true;
                return el.isContentEditable === true;
            }

            /* ---------------- 面板与样式 ---------------- */

            function injectStyle() {
                if (document.getElementById('taikoIconDebugStyle')) return;
                const style = document.createElement('style');
                style.id = 'taikoIconDebugStyle';
                style.textContent = [
                    '#taikoIconDebug{position:fixed;right:10px;bottom:10px;z-index:2147483000;width:300px;',
                    'max-width:calc(100vw - 20px);max-height:calc(100vh - 20px);overflow:auto;-webkit-overflow-scrolling:touch;',
                    'background:rgba(9,12,17,.94);color:#e6eef7;border:1px solid rgba(110,190,255,.45);border-radius:10px;',
                    'padding:9px 10px 10px;font:12px/1.45 ui-monospace,Consolas,Menlo,"Courier New",monospace;',
                    'box-shadow:0 10px 30px rgba(0,0,0,.6);text-align:left;}',
                    '#taikoIconDebug *{box-sizing:border-box;}',
                    '#taikoIconDebug h4{margin:0 0 6px;font-size:12px;font-weight:700;color:#79d9ff;letter-spacing:.04em;}',
                    '#taikoIconDebug h4 span{float:right;color:#7f93a8;font-weight:400;font-size:11px;}',
                    '#taikoIconDebug .row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:5px 0;font-size:11.5px;}',
                    '#taikoIconDebug .k{color:#8fa6bb;}',
                    '#taikoIconDebug .v{color:#ffd479;font-weight:700;}',
                    '#taikoIconDebug .v.dirty{color:#ff9a52;}',
                    '#taikoIconDebug .chip{cursor:pointer;border:1px solid #3d5568;border-radius:6px;padding:1px 6px;color:#c8d8e6;}',
                    '#taikoIconDebug .chip.active{background:#0a84ff;border-color:#0a84ff;color:#fff;}',
                    '#taikoIconDebug .chip.dirty::after{content:"*";color:#ff9a52;}',
                    '#taikoIconDebug button{cursor:pointer;font:inherit;font-size:11.5px;color:#dbe9f6;background:#1b242e;',
                    'border:1px solid #3d5568;border-radius:6px;padding:3px 8px;}',
                    '#taikoIconDebug button:hover{background:#25313d;}',
                    '#taikoIconDebug .loupe{position:relative;margin:7px 0 2px;}',
                    '#taikoIconDebug canvas{display:block;width:100%;height:210px;background:#0d1218;border:1px solid #2d3f4f;border-radius:6px;}',
                    '#taikoIconDebug .loupe-hint{position:absolute;left:6px;top:4px;font-size:11px;color:#9fd0ff;text-shadow:0 1px 3px #000;pointer-events:none;}',
                    '#taikoIconDebug .keys{font-size:10.5px;color:#93a7b9;line-height:1.55;}',
                    '#taikoIconDebug .status{font-size:11px;color:#8ce99a;min-height:15px;opacity:0;transition:opacity .18s;}',
                    '#taikoIconDebug .status.show{opacity:1;}',
                    '#taikoIconDebug textarea{width:100%;height:132px;margin-top:4px;font:11px/1.45 ui-monospace,Consolas,monospace;',
                    'color:#d5ecff;background:#0b1016;border:1px solid #2d3f4f;border-radius:6px;padding:5px;resize:vertical;}',
                    'body.taiko-icon-debug .plate .icon-circle{outline:1px dashed rgba(255,64,200,.7);}',
                    'body.taiko-icon-debug .plate[data-dbg-sel="1"]{outline:2px solid rgba(0,229,255,.85);outline-offset:-2px;z-index:40;}',
                    'body.taiko-icon-debug .plate[data-dbg-sel="1"] .icon-circle{outline:2px solid #ff40c8;}',
                    'body.taiko-icon-debug.taiko-dbg-dim .plate:not([data-dbg-sel="1"]){opacity:.4;}',
                    'body.taiko-icon-debug.taiko-dbg-ghost .plate .icon-circle img{opacity:.4;}'
                ].join('');
                document.head.appendChild(style);
            }

            function buildPanel() {
                injectStyle();
                panel = document.createElement('div');
                panel.id = 'taikoIconDebug';
                panel.setAttribute('role', 'group');
                panel.setAttribute('aria-label', '图标偏移调试面板');
                panel.innerHTML = [
                    '<h4>图标偏移调试<span>Ctrl+Shift+P / Esc</span></h4>',
                    '<div class="row" id="dbgRowMode"></div>',
                    '<div class="row" id="dbgRowStyle"></div>',
                    '<div class="row" id="dbgRowValue"></div>',
                    '<div class="row" id="dbgRowDefault"></div>',
                    '<div class="loupe"><canvas id="dbgCanvas"></canvas><div class="loupe-hint" id="dbgLoupeHint"></div></div>',
                    '<div class="keys">1-6 选种类 · ↑↓←→ 0.1px · Shift 1px · Ctrl 0.01px<br>',
                    'Z 缩放 · M 平滑 · T 半透明 · H 压暗 · O 输出 · R 重置 · U 撤销<br>',
                    '弹窗动画速度：[ 慢 · ] 快 · P 试放翻页</div>',
                    '<div class="row"><button type="button" data-act="output">输出 (O)</button>',
                    '<button type="button" data-act="copy">复制</button>',
                    '<button type="button" data-act="download">下载 txt</button></div>',
                    '<div class="row"><button type="button" data-act="reset-one">重置本种类 (R)</button>',
                    '<button type="button" data-act="reset-all">重置本模式全部</button>',
                    '<button type="button" data-act="close">关闭</button></div>',
                    '<h4 style="margin-top:10px;">弹窗动画速度</h4>',
                    '<div class="row" id="dbgRowSpeed"></div>',
                    '<div class="row"><span class="k">快慢</span>',
                    '<button type="button" data-act="speed-down">慢一点 [</button>',
                    '<button type="button" data-act="speed-up">快一点 ]</button>',
                    '<button type="button" data-act="speed-reset">恢复 1×</button></div>',
                    '<div class="row"><button type="button" data-act="speed-preview">试放翻页动画 (P)</button></div>',
                    '<div class="status" id="dbgStatus"></div>',
                    '<div id="dbgOutWrap" hidden><textarea id="dbgOut" readonly spellcheck="false"></textarea></div>'
                ].join('');
                document.body.appendChild(panel);

                canvas = panel.querySelector('#dbgCanvas');
                ctx = canvas.getContext('2d');
                rowMode = panel.querySelector('#dbgRowMode');
                rowStyle = panel.querySelector('#dbgRowStyle');
                rowValue = panel.querySelector('#dbgRowValue');
                rowDefault = panel.querySelector('#dbgRowDefault');
                rowSpeed = panel.querySelector('#dbgRowSpeed');
                statusEl = panel.querySelector('#dbgStatus');
                outWrap = panel.querySelector('#dbgOutWrap');
                outArea = panel.querySelector('#dbgOut');
                loupeHint = panel.querySelector('#dbgLoupeHint');

                rowStyle.addEventListener('click', function(e) {
                    const chip = e.target && e.target.closest ? e.target.closest('.chip') : null;
                    if (!chip) return;
                    selectStyle(parseInt(chip.getAttribute('data-style'), 10) - 1);
                });

                panel.addEventListener('click', function(e) {
                    const btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
                    if (!btn) return;
                    const act = btn.getAttribute('data-act');
                    if (act === 'output') doOutput();
                    else if (act === 'copy') copyOutput();
                    else if (act === 'download') downloadOutput();
                    else if (act === 'reset-one') resetOne();
                    else if (act === 'reset-all') resetAll();
                    else if (act === 'speed-down') nudgeSpeed(1 / 1.25);
                    else if (act === 'speed-up') nudgeSpeed(1.25);
                    else if (act === 'speed-reset') resetSpeed();
                    else if (act === 'speed-preview') previewModal();
                    else if (act === 'close') disable();
                });

                /* 速度预设 chip */
                panel.addEventListener('click', function(e) {
                    const chip = e.target && e.target.closest ? e.target.closest('.chip[data-speed]') : null;
                    if (!chip) return;
                    applySpeed(parseFloat(chip.getAttribute('data-speed')), true);
                });
            }

            function renderPanel() {
                if (!panel) return;
                const m = mode();
                const scale = currentScale();
                const item = currentOffset();
                const index = state.styleIndex;

                rowMode.innerHTML = '<span class="k">模式</span><span class="v">' + MODE_LABEL[m] + '</span>' +
                    '<span class="k">视口</span>' + window.innerWidth + '×' + window.innerHeight +
                    '<span class="k">--scale</span>' + scale.toFixed(3);

                let chips = '<span class="k">种类</span>';
                for (let s = 0; s < STYLE_COUNT; s++) {
                    chips += '<span class="chip' + (s === index ? ' active' : '') + (isDirty(m, s) ? ' dirty' : '') +
                             '" data-style="' + (s + 1) + '">style-' + (s + 1) + '</span>';
                }
                rowStyle.innerHTML = chips;

                rowValue.innerHTML = '<span class="k">style-' + (index + 1) + '</span>' +
                    '<span class="v' + (isDirty(m, index) ? ' dirty' : '') + '">dx ' + signed(item.dx) + '  dy ' + signed(item.dy) + '</span>' +
                    '<span class="k">基准px ×' + scale.toFixed(3) + ' →</span>' +
                    signed(item.dx * scale) + ' / ' + signed(item.dy * scale) + 'px';

                const base = defaultsOf(m)[index];
                rowDefault.innerHTML = '<span class="k">文件默认</span>dx ' + signed(base.dx) + '  dy ' + signed(base.dy) +
                    (isDirty(m, index) ? '<span class="v dirty">已修改</span>' : '<span class="k">未修改</span>');

                renderSpeedRow();
            }

            /* ---------------- 底板取样与放大镜 ---------------- */

            function getSprite() {
                if (!sprite) {
                    sprite = new Image();
                    sprite.src = 'img/MiniPlate.png';
                }
                return (sprite.complete && sprite.naturalWidth) ? sprite : null;
            }

            /* 当前页面若没有该种类底板（例如某张表只用了 style-1），
               就临时造一个离屏探针底板，保证任何种类都能校准 */
            function makeProbePlate(styleNo) {
                if (!probeHost) {
                    probeHost = document.createElement('div');
                    probeHost.id = 'taikoIconDebugProbe';
                    probeHost.style.cssText = 'position:absolute;left:-99999px;top:0;width:0;height:0;pointer-events:none;';
                    document.body.appendChild(probeHost);
                }
                if (probeStyle !== styleNo) {
                    probeHost.innerHTML = '<div class="plate style-' + styleNo + '"><div class="icon-circle"></div></div>';
                    probeStyle = styleNo;
                }
                return probeHost.firstChild;
            }

            function samplePlate() {
                const area = document.getElementById('contentArea');
                const list = area ? area.querySelectorAll('.plate.style-' + (state.styleIndex + 1)) : [];
                let fallback = null;
                for (let i = 0; i < list.length; i++) {
                    if (list[i].querySelector('.icon-circle img')) {
                        sampleIsProbe = false;
                        return list[i];
                    }
                    if (!fallback) fallback = list[i];
                }
                if (fallback) {
                    sampleIsProbe = false;
                    return fallback;
                }
                sampleIsProbe = true;
                return makeProbePlate(state.styleIndex + 1);
            }

            function drawLoupe() {
                if (!canvas || !ctx) return;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const cssW = canvas.clientWidth || 280;
                const cssH = canvas.clientHeight || 210;
                const pixelW = Math.max(1, Math.round(cssW * dpr));
                const pixelH = Math.max(1, Math.round(cssH * dpr));
                if (canvas.width !== pixelW || canvas.height !== pixelH) {
                    canvas.width = pixelW;
                    canvas.height = pixelH;
                }
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#0d1218';
                ctx.fillRect(0, 0, cssW, cssH);

                const plate = samplePlate();
                if (!plate) return;
                const plateRect = plate.getBoundingClientRect();
                if (!plateRect.width || !plateRect.height) return;

                const circle = plate.querySelector('.icon-circle');
                const circleRect = circle ? circle.getBoundingClientRect() : null;
                const zoom = ZOOMS[state.zoomIndex];
                const centerX = circleRect ? (circleRect.left - plateRect.left + circleRect.width / 2) : plateRect.width / 2;
                const centerY = circleRect ? (circleRect.top - plateRect.top + circleRect.height / 2) : plateRect.height / 2;
                const originX = centerX - (cssW / zoom) / 2;
                const originY = centerY - (cssH / zoom) / 2;

                /* 底板贴图第 style 格正好铺满底板，所以按整格贴图直接换算即可 */
                ctx.imageSmoothingEnabled = state.smooth;
                const sheet = getSprite();
                if (sheet) {
                    const cellW = sheet.naturalWidth / STYLE_COUNT;
                    const cellH = sheet.naturalHeight;
                    ctx.drawImage(sheet, state.styleIndex * cellW, 0, cellW, cellH,
                        -originX * zoom, -originY * zoom, plateRect.width * zoom, plateRect.height * zoom);
                }

                /* 图标按 object-fit: contain 的实际绘制区域重绘，保证放大镜里和页面一致 */
                const icon = plate.querySelector('.icon-circle img');
                if (icon && icon.naturalWidth && icon.naturalHeight) {
                    const iconRect = icon.getBoundingClientRect();
                    if (iconRect.width > 0 && iconRect.height > 0) {
                        const k = Math.min(iconRect.width / icon.naturalWidth, iconRect.height / icon.naturalHeight);
                        const drawW = icon.naturalWidth * k;
                        const drawH = icon.naturalHeight * k;
                        const iconX = (iconRect.left - plateRect.left) + (iconRect.width - drawW) / 2;
                        const iconY = (iconRect.top - plateRect.top) + (iconRect.height - drawH) / 2;
                        ctx.drawImage(icon, 0, 0, icon.naturalWidth, icon.naturalHeight,
                            (iconX - originX) * zoom, (iconY - originY) * zoom, drawW * zoom, drawH * zoom);
                    }
                }

                if (circleRect) {
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(255,64,200,.95)';
                    ctx.strokeRect((circleRect.left - plateRect.left - originX) * zoom + 0.5,
                                   (circleRect.top - plateRect.top - originY) * zoom + 0.5,
                                   circleRect.width * zoom, circleRect.height * zoom);
                    const cx = (centerX - originX) * zoom;
                    const cy = (centerY - originY) * zoom;
                    ctx.strokeStyle = 'rgba(0,229,255,.9)';
                    ctx.beginPath();
                    ctx.moveTo(cx, 0); ctx.lineTo(cx, cssH);
                    ctx.moveTo(0, cy); ctx.lineTo(cssW, cy);
                    ctx.stroke();
                }

                if (loupeHint) {
                    loupeHint.textContent = ZOOMS[state.zoomIndex] + '× · ' + (state.smooth ? '平滑' : '像素') +
                        (sampleIsProbe ? ' · 探针底板' : '');
                }
            }

            function loop() {
                rafId = 0;
                if (!state.on) return;
                const now = Date.now();
                if (now - lastDraw >= LOUPE_INTERVAL) {
                    lastDraw = now;
                    drawLoupe();
                }
                rafId = requestAnimationFrame(loop);
            }

            function startLoop() {
                if (!rafId && state.on) rafId = requestAnimationFrame(loop);
            }

            function stopLoop() {
                if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
            }

            /* ---------------- 选中种类的高亮 ---------------- */

            function markSelected() {
                const area = document.getElementById('contentArea');
                if (!area) return;
                const plates = area.querySelectorAll('.plate');
                const want = 'style-' + (state.styleIndex + 1);
                for (let i = 0; i < plates.length; i++) {
                    if (plates[i].classList.contains(want)) plates[i].setAttribute('data-dbg-sel', '1');
                    else plates[i].removeAttribute('data-dbg-sel');
                }
            }

            function clearMarks() {
                const area = document.getElementById('contentArea');
                if (!area) return;
                const marked = area.querySelectorAll('.plate[data-dbg-sel]');
                for (let i = 0; i < marked.length; i++) marked[i].removeAttribute('data-dbg-sel');
            }

            function startObserver() {
                const area = document.getElementById('contentArea');
                if (!area || observer || !window.MutationObserver) return;
                observer = new MutationObserver(function() { markSelected(); });
                observer.observe(area, { childList: true, subtree: true });
            }

            function stopObserver() {
                if (observer) { observer.disconnect(); observer = null; }
            }

            /* ---------------- 操作 ---------------- */

            function selectStyle(index) {
                if (!(index >= 0 && index < STYLE_COUNT)) return;
                state.styleIndex = index;
                markSelected();
                renderPanel();
                drawLoupe();
            }

            function nudge(ddx, ddy) {
                const m = mode();
                const item = BRIDGE.nudge(m, state.styleIndex, ddx, ddy);
                if (!item) return;
                BRIDGE.save();
                BRIDGE.apply();
                renderPanel();
                drawLoupe();
                const scale = currentScale();
                setStatus('style-' + (state.styleIndex + 1) + '  dx ' + signed(item.dx) + '  dy ' + signed(item.dy) +
                          '  （渲染 ' + signed(item.dx * scale) + ' / ' + signed(item.dy * scale) + 'px）');
            }

            function resetOne() {
                const m = mode();
                snapshotForUndo(m);
                BRIDGE.reset(m, state.styleIndex);
                BRIDGE.save();
                BRIDGE.apply();
                renderPanel();
                drawLoupe();
                setStatus('已把 style-' + (state.styleIndex + 1) + ' 恢复为文件默认值（' + MODE_LABEL[m] + '），按 U 可撤销');
            }

            function resetAll() {
                const m = mode();
                snapshotForUndo(m);
                BRIDGE.reset(m, null);
                BRIDGE.save();
                BRIDGE.apply();
                renderPanel();
                drawLoupe();
                setStatus('已把 ' + MODE_LABEL[m] + ' 全部种类恢复为文件默认值，按 U 可撤销');
            }

            /* 重置前留一份快照，避免误按 R / Shift+R 把刚校准好的数值丢掉 */
            function snapshotForUndo(m) {
                undoSnapshot = {
                    mode: m,
                    list: offsetsOf(m).map(function(p) { return { dx: p.dx, dy: p.dy }; })
                };
            }

            function restoreUndo() {
                if (!undoSnapshot) {
                    setStatus('没有可撤销的重置记录');
                    return;
                }
                const snapshot = undoSnapshot;
                const target = offsetsOf(snapshot.mode);
                for (let i = 0; i < target.length && i < snapshot.list.length; i++) {
                    target[i].dx = snapshot.list[i].dx;
                    target[i].dy = snapshot.list[i].dy;
                }
                undoSnapshot = null;
                BRIDGE.save();
                BRIDGE.apply();
                renderPanel();
                drawLoupe();
                setStatus('已撤销重置，恢复为重置前的数值（' + MODE_LABEL[snapshot.mode] + '）');
            }

            function cycleZoom() {
                state.zoomIndex = (state.zoomIndex + 1) % ZOOMS.length;
                renderPanel();
                drawLoupe();
                setStatus('放大镜 ' + ZOOMS[state.zoomIndex] + '×');
            }

            function toggleSmooth() {
                state.smooth = !state.smooth;
                renderPanel();
                drawLoupe();
                setStatus(state.smooth ? '平滑采样（接近浏览器实际渲染）' : '像素采样（便于逐像素比对）');
            }

            function toggleGhost() {
                state.ghost = !state.ghost;
                document.body.classList.toggle('taiko-dbg-ghost', state.ghost);
                setStatus(state.ghost ? '图标已半透明，便于看凹槽' : '图标恢复不透明');
            }

            function toggleDim() {
                state.dim = !state.dim;
                document.body.classList.toggle('taiko-dbg-dim', state.dim);
                setStatus(state.dim ? '其它种类已压暗' : '已取消压暗');
            }

            /* ---------------- 输出 ---------------- */

            function measureSelected() {
                const plate = samplePlate();
                if (!plate) return null;
                const plateRect = plate.getBoundingClientRect();
                const circle = plate.querySelector('.icon-circle');
                const circleRect = circle ? circle.getBoundingClientRect() : null;
                return {
                    probe: sampleIsProbe,
                    width: plateRect.width,
                    height: plateRect.height,
                    left: circleRect ? circleRect.left - plateRect.left : null,
                    top: circleRect ? circleRect.top - plateRect.top : null,
                    diameter: circleRect ? circleRect.width : null
                };
            }

            function buildOutput() {
                const m = mode();
                const scale = currentScale();
                const info = measureSelected();
                const lines = [];
                lines.push('==== TaikoNavigation 图标偏移调试输出 ====');
                lines.push('时间: ' + new Date().toLocaleString());
                lines.push('模式: ' + MODE_LABEL[m] + '（' + (m === 'mobile' ? 'innerWidth <= 768' : 'innerWidth > 768') + '）');
                lines.push('视口: ' + window.innerWidth + ' x ' + window.innerHeight + '   DPR ' + (window.devicePixelRatio || 1));
                lines.push('--scale: ' + scale.toFixed(4));
                if (info) {
                    lines.push('底板实测: ' + info.width.toFixed(2) + ' x ' + info.height.toFixed(2) + ' px' +
                               (info.probe ? '（探针底板：当前页没有 style-' + (state.styleIndex + 1) + '）' : ''));
                    if (info.diameter !== null) {
                        lines.push('图标圆实测: 直径 ' + info.diameter.toFixed(2) + 'px · 相对底板 left ' +
                                   info.left.toFixed(2) + 'px, top ' + info.top.toFixed(2) + 'px');
                    }
                }
                lines.push('说明: 数值单位是"底板基准像素"，渲染时乘以 --scale（PC 端 --scale 恒为 1）。');
                lines.push('');
                lines.push('---- 1) 写回 index.html：替换 DEFAULT_ICON_OFFSETS 里的两个数组 ----');
                ['mobile', 'pc'].forEach(function(mm) {
                    lines.push('    ' + mm + ': [');
                    const list = offsetsOf(mm);
                    for (let i = 0; i < STYLE_COUNT; i++) {
                        lines.push('        { dx: ' + trim(list[i].dx) + ', dy: ' + trim(list[i].dy) + ' }' +
                                   (i < STYLE_COUNT - 1 ? ',' : ' ') + '   // style-' + (i + 1) +
                                   (isDirty(mm, i) ? '  <- 本次校准' : ''));
                    }
                    lines.push('    ]' + (mm === 'mobile' ? ',' : ''));
                });
                lines.push('');
                lines.push('---- 2) 等价的 CSS 变量写法（这里的 px 是渲染值） ----');
                const list = offsetsOf(m);
                for (let i = 0; i < STYLE_COUNT; i++) {
                    lines.push('--icon-dx-' + (i + 1) + ': ' + trim(list[i].dx * scale) + 'px;  --icon-dy-' + (i + 1) + ': ' + trim(list[i].dy * scale) + 'px;');
                }
                lines.push('');
                lines.push('---- 3) 机器可读数据 ----');
                lines.push(JSON.stringify({
                    mode: m,
                    scale: Math.round(scale * 10000) / 10000,
                    viewport: [window.innerWidth, window.innerHeight],
                    mobile: offsetsOf('mobile').map(function(p) { return [p.dx, p.dy]; }),
                    pc: offsetsOf('pc').map(function(p) { return [p.dx, p.dy]; })
                }));
                lines.push('');
                lines.push('// 写回文件后清掉本地调试缓存：localStorage.removeItem(' + JSON.stringify(BRIDGE.storageKey) + ')');
                return lines.join('\n');
            }

            function doOutput() {
                const text = buildOutput();
                outWrap.hidden = false;
                outArea.value = text;
                state.hasOutput = true;
                try { console.log(text); } catch (e) {}
                outArea.focus();
                outArea.select();
                setStatus('已输出到控制台和下面的文本框（已全选，可 Ctrl+C）');
            }

            function copyOutput() {
                if (!state.hasOutput || !outArea.value) doOutput();
                const text = outArea.value;
                outArea.focus();
                outArea.select();
                let done = false;
                try { done = document.execCommand('copy'); } catch (e) { done = false; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        setStatus('已复制到剪贴板');
                    }, function() {
                        setStatus(done ? '已复制到剪贴板' : '复制被浏览器拦截：文本已全选，请按 Ctrl+C');
                    });
                } else {
                    setStatus(done ? '已复制到剪贴板' : '复制失败：文本已全选，请按 Ctrl+C');
                }
            }

            function downloadOutput() {
                if (!state.hasOutput || !outArea.value) doOutput();
                try {
                    const blob = new Blob([outArea.value], { type: 'text/plain;charset=utf-8' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'taiko-icon-offsets-' + mode() + '.txt';
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(function() {
                        URL.revokeObjectURL(link.href);
                        link.remove();
                    }, 1500);
                    setStatus('已开始下载 taiko-icon-offsets-' + mode() + '.txt');
                } catch (e) {
                    setStatus('下载失败：' + e.message);
                }
            }

            /* ---------------- 开关与键盘 ---------------- */

            function enable() {
                if (state.on) return;
                state.on = true;
                if (!panel) buildPanel();
                document.body.classList.add('taiko-icon-debug');
                if (state.dim) document.body.classList.add('taiko-dbg-dim');
                if (state.ghost) document.body.classList.add('taiko-dbg-ghost');
                panel.hidden = false;
                markSelected();
                startObserver();
                renderPanel();
                startLoop();
                setStatus('数字键选种类，方向键微调，O 输出；[ ] 调弹窗动画速度，P 试放');
                console.log('[TaikoNavigation] 调试面板已开启：1-6 选种类，方向键 0.1px 微调，O 输出结果；[ / ] 调弹窗动画速度，P 试放翻页');
            }

            function disable() {
                if (!state.on) return;
                state.on = false;
                stopLoop();
                stopObserver();
                document.body.classList.remove('taiko-icon-debug', 'taiko-dbg-dim', 'taiko-dbg-ghost');
                clearMarks();
                if (panel) panel.hidden = true;
                console.log('[TaikoNavigation] 图标偏移调试已关闭；调试数值仍在生效（按 R 可还原，或清理 localStorage）');
            }

            function isArrowKey(key) {
                return key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown';
            }

            /* ---------------- 弹窗动画速度 ---------------- */

            function speedValue() {
                return (MODAL_BRIDGE && MODAL_BRIDGE.get) ? MODAL_BRIDGE.get() : 1;
            }

            function speedText(v) {
                return (Math.round(v * 100) / 100) + '×';
            }

            /* 切换动画的基准时长：10 帧 @60fps。显示时换算成秒与帧数 */
            function switchSeconds(v) { return 0.1667 / v; }
            function switchFrames(v) { return Math.round(10 / v); }

            function applySpeed(value, announce) {
                if (!MODAL_BRIDGE) { setStatus('当前页面没有弹窗调速接口'); return; }
                const v = MODAL_BRIDGE.set(value);
                renderSpeedRow();
                if (announce) {
                    setStatus('切换动画 ' + speedText(v) + '：' + switchSeconds(v).toFixed(3) + 's / ' +
                              switchFrames(v) + ' 帧（前 6 成匀速，后 4 成匀减速到 0）');
                }
                return v;
            }

            function nudgeSpeed(factor) {
                applySpeed(speedValue() * factor, true);
            }

            function resetSpeed() {
                if (!MODAL_BRIDGE) return;
                applySpeed(MODAL_BRIDGE.reset(), true);
            }

            function previewModal() {
                if (!MODAL_BRIDGE || !MODAL_BRIDGE.preview) { setStatus('当前页面没有弹窗调速接口'); return; }
                const wasOpen = MODAL_BRIDGE.isOpen && MODAL_BRIDGE.isOpen();
                const ok = MODAL_BRIDGE.preview();
                setStatus(!ok ? '当前工作表没有可预览的链接'
                              : (wasOpen ? '翻到下一页，看看速度' : '打开弹窗，看看速度'));
            }

            function renderSpeedRow() {
                if (!rowSpeed) return;
                if (!MODAL_BRIDGE) {
                    rowSpeed.innerHTML = '<span class="k">本页无弹窗调速接口</span>';
                    return;
                }
                const v = speedValue();
                let chips = '<span class="k">倍率</span><span class="v">' + speedText(v) + '</span>' +
                            '<span class="k">全程</span>' + switchSeconds(v).toFixed(3) + 's / ' +
                            switchFrames(v) + ' 帧';
                let presetHtml = '<span class="k">预设</span>';
                SPEED_PRESETS.forEach(function(p) {
                    presetHtml += '<span class="chip' + (Math.abs(p - v) < 0.001 ? ' active' : '') +
                                  '" data-speed="' + p + '">' + p + '×</span>';
                });
                rowSpeed.innerHTML = chips + '<br>' + presetHtml;
            }

            function onKeyDown(e) {
                /* Ctrl+Shift+P 开关（用 e.code，避免大小写和输入法差异） */
                if (e.ctrlKey && e.shiftKey && !e.altKey && e.code === 'KeyP') {
                    e.preventDefault();
                    e.stopPropagation();
                    if (!e.repeat) { if (state.on) disable(); else enable(); }
                    return;
                }

                if (!state.on) return;

                if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    disable();
                    return;
                }

                /* 弹窗开着时方向键留给弹窗翻页，别被抢过来微调图标 */
                if (MODAL_BRIDGE && MODAL_BRIDGE.isOpen && MODAL_BRIDGE.isOpen() && isArrowKey(e.key)) return;

                /* 保留 Ctrl+C / Ctrl+V 等组合键；在输入框里打字时不抢键 */
                if ((e.ctrlKey || e.metaKey) && !isArrowKey(e.key)) return;
                if (isEditableTarget()) return;

                let step = STEP_NORMAL;
                if (e.ctrlKey) step = STEP_FINE;
                else if (e.shiftKey) step = STEP_COARSE;

                let handled = true;
                switch (e.key) {
                    case 'ArrowLeft': nudge(-step, 0); break;
                    case 'ArrowRight': nudge(step, 0); break;
                    case 'ArrowUp': nudge(0, -step); break;
                    case 'ArrowDown': nudge(0, step); break;
                    case '1': case '2': case '3': case '4': case '5': case '6':
                        selectStyle(parseInt(e.key, 10) - 1);
                        break;
                    case 'o': case 'O': doOutput(); break;
                    case 'r': case 'R':
                        if (e.shiftKey) resetAll(); else resetOne();
                        break;
                    case 'z': case 'Z': cycleZoom(); break;
                    case 'm': case 'M': toggleSmooth(); break;
                    case 't': case 'T': toggleGhost(); break;
                    case 'h': case 'H': toggleDim(); break;
                    case 'u': case 'U': restoreUndo(); break;
                    case '[': case '【': nudgeSpeed(1 / 1.25); break;
                    case ']': case '】': nudgeSpeed(1.25); break;
                    case 'p': case 'P': previewModal(); break;
                    default: handled = false;
                }
                if (handled) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }

            window.addEventListener('keydown', onKeyDown, true);

            /* 备用入口：?icondebug=1 */
            if (/[?&]icondebug=1(&|$)/.test(window.location.search)) {
                if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enable);
                else enable();
            }
        })();
    </script>
</body>
</html>
