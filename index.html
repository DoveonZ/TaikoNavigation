<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>TaikoNavigation - 太鼓达人导航</title>
    <style>
        :root {
            --gold: #cc9c56;
            --black: #000000;
            --white: #ffffff;
            --plate-width: 120px;
            --plate-height: 252px;
            --sprite-bg-width: 720px;
            --sprite-bg-height: 252px;
            --icon-diameter: 57px;
            --icon-left: 31.5px;
            --icon-top: 27px;
            --rope-width: 6px;
            --rope-height: 50px;
            --thin-black-height: 3px;
            --gold-block-height: 10px;
            --gold-title-height: 52px;
            --gold-name-height: 30px;
            --columns: 12;
            --gap-h: 14px;
            --content-max-width: 1680px;
            --bg-image: url('img/background.png');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a0f;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 16px 0 30px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.22);
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: var(--content-max-width);
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex-shrink: 0;
        }

        .gold-bar {
            background: var(--gold);
            flex-shrink: 0;
            opacity: 0.92;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        .gold-bar.thin {
            height: var(--gold-block-height);
        }

        .gold-bar.title-bar {
            height: var(--gold-title-height);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        .content-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex-shrink: 0;
        }

        .row-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            /* 不再需要动画初始状态，已移除 opacity 和 animation-fill-mode */
        }

        /* 动画只作用于 plates-row（牌子和绳索所在的容器） */
        .plates-row.row-animate,
        .plates-row.row-animate-reverse {
            opacity: 0;
            animation-fill-mode: both;
        }

        .plates-row.row-animate {
            animation-name: slideInLeft;
            animation-duration: 0.9s;
            animation-timing-function: ease-out;
        }

        .plates-row.row-animate-reverse {
            animation-name: slideInRight;
            animation-duration: 0.9s;
            animation-timing-function: ease-out;
        }

        @keyframes slideInLeft {
            0%   { opacity: 0; transform: translateX(-35vw); }
            26%  { opacity: 1; transform: translateX(0); }
            52%  { transform: translateX(-8vw); }
            67%  { transform: translateX(0); }
            78%  { transform: translateX(-4vw); }
            89%  { transform: translateX(0); }
            96%  { transform: translateX(-2vw); }
            97%  { transform: translateX(0); }
            98%  { transform: translateX(-1vw); }
            99%  { transform: translateX(0); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            0%   { opacity: 0; transform: translateX(35vw); }
            26%  { opacity: 1; transform: translateX(0); }
            52%  { transform: translateX(8vw); }
            67%  { transform: translateX(0); }
            78%  { transform: translateX(4vw); }
            89%  { transform: translateX(0); }
            96%  { transform: translateX(2vw); }
            97%  { transform: translateX(0); }
            98%  { transform: translateX(1vw); }
            99%  { transform: translateX(0); }
            100% { opacity: 1; transform: translateX(0); }

        }

        .black-line {
            height: var(--thin-black-height);
            background: var(--black);
            flex-shrink: 0;
            opacity: 0.9;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        .plates-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: var(--gap-h);
            flex-wrap: nowrap;
            width: 100%;
            padding: 0;
            flex-shrink: 0;
        }

        .plate-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: var(--plate-width);
            flex-shrink: 0;
        }

        .rope {
            width: var(--rope-width);
            height: var(--rope-height);
            background: var(--black);
            flex-shrink: 0;
            opacity: 0.9;
            margin: 0 auto;
            border-radius: 2px 2px 0 0;
            margin-bottom: -12px;
            position: relative;
            z-index: 1;
        }

        /* 空牌位对应的绳索完全隐藏 */
        .empty-unit .rope {
            opacity: 0;
        }

        .plate {
            width: var(--plate-width);
            height: var(--plate-height);
            background-image: url('img/MiniPlate.png');
            background-size: var(--sprite-bg-width) var(--sprite-bg-height);
            background-repeat: no-repeat;
            position: relative;
            cursor: pointer;
            transition: transform 0.22s ease, filter 0.22s ease;
            filter: drop-shadow(3px 4px 7px rgba(0, 0, 0, 0.5));
            flex-shrink: 0;
            z-index: 2;
        }

        .plate:hover {
            transform: translateY(-6px);
            filter: drop-shadow(4px 8px 16px rgba(0, 0, 0, 0.6)) brightness(1.07);
            z-index: 10;
        }

        .plate:active {
            transform: translateY(-2px);
            transition: transform 0.06s ease;
        }

        .plate.style-1 { background-position: 0% 0; }
        .plate.style-2 { background-position: 20% 0; }
        .plate.style-3 { background-position: 40% 0; }
        .plate.style-4 { background-position: 60% 0; }
        .plate.style-5 { background-position: 79.8% 0; }
        .plate.style-6 { background-position: 99.8% 0; }

        .plate.empty-plate {
            cursor: default;
            opacity: 0;
            filter: drop-shadow(2px 3px 5px rgba(0, 0, 0, 0.3)) grayscale(10%);
        }
        .plate.empty-plate:hover {
            transform: none;
            filter: drop-shadow(2px 3px 5px rgba(0, 0, 0, 0.3)) grayscale(10%);
            cursor: default;
        }

        .plate .icon-circle {
            position: absolute;
            width: var(--icon-diameter);
            height: var(--icon-diameter);
            border-radius: 50%;
            overflow: hidden;
            left: var(--icon-left);
            top: var(--icon-top);
            background: rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.25);
        }

        .plate .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .plate.empty-plate .icon-circle { display: none; }

        .gold-name-row {
            background: var(--gold);
            opacity: 0.92;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: var(--gap-h);
            flex-wrap: nowrap;
            height: var(--gold-name-height);
            flex-shrink: 0;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        .name-slot {
            width: var(--plate-width);
            text-align: center;
            flex-shrink: 0;
            color: var(--white);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 3px;
            user-select: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.45);
            transition: color 0.2s ease;
            cursor: default;
        }

        .name-slot.has-link { cursor: pointer; }
        .name-slot.has-link:hover {
            color: #fffef0;
            text-shadow: 1px 1px 6px rgba(255, 255, 255, 0.5);
        }
        .name-slot.empty-name {
            opacity: 0;
            cursor: default;
        }

        .footer-gold {
            height: var(--gold-block-height);
            background: var(--gold);
            opacity: 0.92;
            flex-shrink: 0;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        @media (max-width: 768px) {
            :root {
                --plate-width: 68px;
                --plate-height: 143px;
                --sprite-bg-width: 408px;
                --sprite-bg-height: 143px;
                --icon-diameter: 32px;
                --icon-left: 18px;
                --icon-top: 14.5px;
                --rope-width: 4px;
                --rope-height: 38px;
                --thin-black-height: 2.5px;
                --gold-block-height: 8px;
                --gold-title-height: 42px;
                --gold-name-height: 24px;
                --columns: 5;
                --gap-h: 7px;
                --content-max-width: 420px;
                --bg-image: url('img/background.jpg');
            }
            body { padding: 8px 0 16px; }
            .main-container { padding: 0 6px; }
            .gold-bar.title-bar { font-size: 1.3rem; letter-spacing: 0.06em; }
            .plate { filter: drop-shadow(2px 3px 4px rgba(0, 0, 0, 0.5)); }
            .plate:hover {
                transform: translateY(-4px);
                filter: drop-shadow(3px 6px 10px rgba(0, 0, 0, 0.55)) brightness(1.05);
            }
            .plate .icon-circle {
                border: 1.5px solid rgba(255, 255, 255, 0.2);
                box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.25);
            }
            .plate.empty-plate { opacity: 0; }
            .name-slot { font-size: 0.6rem; letter-spacing: 0.02em; }
            .rope { border-radius: 1.5px 1.5px 0 0; margin-bottom: -8px; position: relative; z-index: 1; }
            .content-area {
                max-height: 78vh;
                overflow-y: auto;
                overflow-x: visible;
                padding-bottom: 4px;
                scrollbar-width: thin;
                scrollbar-color: rgba(204, 156, 86, 0.5) transparent;
                -webkit-overflow-scrolling: touch;
            }
            .content-area::-webkit-scrollbar { width: 4px; }
            .content-area::-webkit-scrollbar-track { background: transparent; }
            .content-area::-webkit-scrollbar-thumb {
                background: rgba(204, 156, 86, 0.45);
                border-radius: 3px;
            }
            /* 移动端动画（可根据需要调整，此处沿用全局定义，也可单独覆盖） */
        }

        @media (max-width: 380px) {
            :root {
                --plate-width: 56px;
                --plate-height: 118px;
                --sprite-bg-width: 336px;
                --sprite-bg-height: 118px;
                --icon-diameter: 26px;
                --icon-left: 15px;
                --icon-top: 12px;
                --rope-width: 3.5px;
                --rope-height: 32px;
                --gold-title-height: 36px;
                --gold-name-height: 20px;
                --gap-h: 4px;
            }
            .rope { margin-bottom: -6px; }
            .name-slot { font-size: 0.5rem; }
            .gold-bar.title-bar { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="header">
            <div class="gold-bar thin"></div>
            <div class="gold-bar title-bar">TaikoNavigation</div>
            <div class="gold-bar thin"></div>
        </header>

        <div class="content-area" id="contentArea"></div>

        <div class="footer-gold"></div>
    </div>

    <script>
        (function() {
            const linksData = [
                { name: '太鼓之达人官方', url: 'https://space.bilibili.com/3493292593383796', desc: '', icon: '0.png', style: 1 },
                { name: '华立电竞', url: 'https://space.bilibili.com/332563726', desc: '', icon: 'wec.png', style: 1 },
                { name: '太鼓WIKI（日）', url: 'https://wikiwiki.jp/taiko-fumen/', desc: '日本玩家搭建的wiki，数据全面历史悠久', icon: 'wiki.png', style: 1 },
                { name: '太鼓WIKI（韩）', url: 'https://wikiwiki.jp/taiko-fumen/', desc: '韩国玩家搭建的wiki，数据全面历史悠久', icon: 'wiki_ko.png', style: 1 },
                { name: '太鼓Fandom', url: 'https://taiko.fandom.com/zh/wiki/%E9%A6%96%E9%A0%81', desc: '', icon: '0.png', style: 1 },
                { name: '音游地图', url: 'https://map.bemanicn.com/games/31', desc: '', icon: 'bemani.png', style: 1 },
                { name: '葉月ゆら主页', url: 'https://hatukiyura.sakura.ne.jp/', desc: '叶月由罗的个人主页，可以查询到其往年作品和活动日程', icon: 'yura.jpg', style: 1 },

                { name: 'Rating系统', url: 'https://v2.rating.ourtaiko.org/v2test', desc: '国内玩家开发的成绩评分系统', icon: '0.png', style: 2 },
                { name: 'Database定数表', url: 'https://fumen-database.com/difficulty/?const_desc', desc: '', icon: 'wiki.png', style: 2 },
                { name: 'Donder查分器', url: 'https://prober.ourtaiko.org/search', desc: '', icon: 'luluxia.png', style: 2 },
                { name: 'DonderNote', url: 'https://hatahata.outsystemscloud.com/DonderNote/Menu', desc: '', icon: 'DonderNote.png', style: 2 },

                { name: 'TaikoNauts', url: 'https://seesaawiki.jp/taikonauts/', desc: '', icon: 'TaikoNauts.ico', style: 3 },
                { name: 'OpenTaiko', url: 'https://opentaiko.github.io/', desc: '', icon: 'OpenTaiko.ico', style: 3 },
                { name: 'ESE TJA', url: 'https://ese.tjadataba.se/ESE/ESE/', desc: '', icon: 'ese.png', style: 3 },
                { name: 'ESE Helper', url: 'https://taiko.vanillaaaa.org/', desc: '', icon: 'ese.png', style: 3 },
                { name: 'PeepoDrumKit', url: 'https://wwaya.lanzoup.com/iHj8b3e7ooyh', desc: '可视化的谱面编辑，让小白也能迅速创建自己的太鼓谱面', icon: 'PeepoDrumKit.ico', style: 3 },
                { name: 'TaikoWeb', url: 'https://taiko.asia/', desc: '太鼓达人在线模拟器', icon: 'taikoweb.png', style: 3 },

                { name: '歌曲检索器', url: 'https://olaf5103.cn:765/taiko/songs', desc: '', icon: '0.png', style: 4 },
                { name: 'Donder Asistant', url: 'https://dafrok.github.io/donder-assistant/analysis', desc: '', icon: '0.png', style: 4 },
                { name: 'Tja-Tools', url: 'https://whmhammer.github.io/tja-tools/', desc: '可以将tja文件转化为静态谱面图', icon: '0.png', style: 4 },
                { name: 'Tja Analyser', url: 'https://tjaanalyzer-ja.ckq.me/', desc: '', icon: '0.png', style: 4 },
                { name: 'TaikoImager', url: 'https://doveonz.github.io/Taiko-no-Tatsujin-Imager/', desc: '可以获得还原官方视觉效果的谱面片段或谱面图，支持各种演奏选项', icon: '0.png', style: 4 },
                { name: 'AI定数预测', url: 'https://tjapre.haxif.com/', desc: '让AI对你创作的谱面进行难度的初步评估', icon: 'kokoko.jpg', style: 4 },
                { name: '猫鼓的小店', url: 'https://m.tb.cn/h.8ceeLYiw0FAY9K7', desc: '', icon: 'cat.png', style: 5 },
                { name: 'Power的小店', url: 'https://m.tb.cn/h.8Yfnk26SrA8pUqZ', desc: '', icon: 'power.png', style: 5 },
                { name: '鱼鼓的小店', url: 'https://m.tb.cn/h.81neAPV?tk=6DKIgHaFqR5', desc: '', icon: 'sakataiko.png', style: 5 },
                { name: '神童同学', url: 'https://m.tb.cn/h.8cJNqUO?tk=jmmEgH1Qo0i', desc: '', icon: 'stg.png', style: 5 },
                { name: '单手全连逆战', url: 'https://m.tb.cn/h.8cqwDXa?tk=hurZgHYHZl1', desc: '', icon: 'nizhan.png', style: 5 },
                { name: '狂澜怒涛', url: 'https://m.tb.cn/h.8cqx9ES?tk=zVYNgHYHAvf', desc: '', icon: '7f7f.png', style: 5 },
                { name: '西瓜的音游小铺', url: 'https://m.tb.cn/h.8Ys9Atv?tk=ZPbKgHYti3K', desc: '', icon: 'watermelon.png', style: 5 },
                { name: 'ZDR', url: 'https://m.tb.cn/h.8210xIi?tk=yD8tgHYztMN', desc: '', icon: 'zdr.png', style: 5 },
                { name: '活体搁浅', url: 'https://m.tb.cn/h.81pdJXR?tk=0WqugHYwWq5', desc: '', icon: 'wai.jpg', style: 5 },
                { name: '不灭的灯', url: 'https://m.tb.cn/h.81pYYTI?tk=qfzFgHYu00f', desc: '', icon: 'deng.png', style: 5 },
                { name: '小言罐头', url: 'https://m.tb.cn/h.82YviOa?tk=oo9hgHYtJGQ', desc: '', icon: 'yan.png', style: 5 },
                { name: '哈基缘', url: 'https://m.tb.cn/h.8217LAp?tk=rOm4gH16WJD', desc: '', icon: 'yuan.png', style: 5 },
                { name: '小章木工坊', url: 'https://mobile.yangkeduo.com/mall_page.html?ps=IpGOWhdEwr', desc: '', icon: 'pdd.png', style: 5 },

                { name: '菌菌控制台', url: 'https://kinoko.zorua.cn/', desc: '菌菌控制台！可以管理自己的成绩以及使用菌菌的多项隐藏功能！', icon: 'junjun.png', style: 6 },
                { name: '菌菌别名表格', url: 'https://www.kdocs.cn/l/cauSVZId2ohu', desc: '', icon: 'junjun.png', style: 6 },
                { name: 'Sakura Bot', url: 'https://viewer.sakura-bot.cn/', desc: '', icon: '0.png', style: 6 },
            ];

            function getConfig() {
                const isMobile = window.innerWidth <= 768;
                return {
                    columns: isMobile ? 5 : 12,
                    defaultRows: isMobile ? 5 : 2,
                    isMobile: isMobile,
                };
            }

            function escapeHTML(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function createPlateHTML(linkData, index) {
                const hasLink = linkData && linkData.url;
                const styleNum = linkData ? linkData.style : ((index % 6) + 1);
                const iconSrc = linkData && linkData.icon ? 'img/icon/' + linkData.icon : '';
                const name = linkData ? linkData.name : '';
                const url = linkData ? linkData.url : '';
                const desc = linkData ? (linkData.desc || '') : '';
                const isEmpty = !hasLink;

                const plateClass = 'plate style-' + styleNum + (isEmpty ? ' empty-plate' : '');
                let html = '<div class="plate-unit' + (hasLink ? '' : ' empty-unit') + '">';
                html += '<div class="rope"></div>';
                html += '<div class="' + plateClass + '"';
                if (hasLink && desc) {
                    html += ' title="' + escapeHTML(desc) + '"';
                }
                if (hasLink) {
                    html += ' onclick="window.open(\'' + escapeHTML(url) + '\', \'_blank\')" style="cursor:pointer;"';
                }
                html += '>';
                if (hasLink && iconSrc) {
                    html += '<div class="icon-circle">';
                    html += '<img src="' + escapeHTML(iconSrc) + '" alt="' + escapeHTML(name) + '" loading="lazy" onerror="this.style.display=\'none\'">';
                    html += '</div>';
                }
                html += '</div>';
                html += '</div>';
                return html;
            }

            function createNameHTML(linkData) {
                const hasLink = linkData && linkData.url;
                const name = linkData ? linkData.name : '';
                const url = linkData ? linkData.url : '';
                const cls = 'name-slot' + (hasLink ? ' has-link' : ' empty-name');
                let html = '<span class="' + cls + '"';
                if (hasLink) {
                    html += ' onclick="window.open(\'' + escapeHTML(url) + '\', \'_blank\')" style="cursor:pointer;"';
                }
                html += '>' + escapeHTML(name) + '</span>';
                return html;
            }

            function renderAll() {
                const config = getConfig();
                const columns = config.columns;
                const defaultRows = config.defaultRows;
                const totalLinks = linksData.length;
                const minSlots = Math.max(defaultRows * columns, totalLinks);
                const rows = Math.ceil(minSlots / columns);
                const totalSlots = rows * columns;

                const allSlots = [];
                for (let i = 0; i < totalSlots; i++) {
                    allSlots.push(i < totalLinks ? linksData[i] : null);
                }

                const contentArea = document.getElementById('contentArea');
                let html = '';

                for (let row = 0; row < rows; row++) {
                    const rowSlots = allSlots.slice(row * columns, (row + 1) * columns);

                    // 奇数行从左飞入，偶数行从右飞入，动画只作用于 plates-row
                    const directionClass = (row % 2 === 0) ? 'row-animate' : 'row-animate-reverse';

                    html += '<div class="row-group">';
                    html += '<div class="black-line"></div>';
                    html += '<div class="plates-row ' + directionClass + '">';
                    for (let col = 0; col < columns; col++) {
                        html += createPlateHTML(rowSlots[col] || null, row * columns + col);
                    }
                    html += '</div>';
                    html += '<div class="black-line"></div>';
                    html += '<div class="gold-name-row">';
                    for (let col = 0; col < columns; col++) {
                        html += createNameHTML(rowSlots[col] || null);
                    }
                    html += '</div>';
                    html += '<div class="black-line"></div>';
                    html += '</div>';
                }

                contentArea.innerHTML = html;

                if (config.isMobile) {
                    contentArea.scrollTop = 0;
                }
            }

            renderAll();

            let resizeTimeout;
            let lastIsMobile = window.innerWidth <= 768;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(function() {
                    const currentIsMobile = window.innerWidth <= 768;
                    if (currentIsMobile !== lastIsMobile) {
                        lastIsMobile = currentIsMobile;
                        renderAll();
                    }
                }, 250);
            });

            document.addEventListener('error', function(e) {
                if (e.target && e.target.tagName === 'IMG' && e.target.closest('.icon-circle')) {
                    e.target.style.display = 'none';
                }
            }, true);
        })();
    </script>
</body>
</html>
