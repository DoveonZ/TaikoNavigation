<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>TaikoNavigation - 太鼓达人导航</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --gold: #cc9c56;
            --black: #000000;
            --white: #ffffff;
            --plate-width: 120px;
            --plate-height: 252px;
            --sprite-bg-width: 720px;
            --sprite-bg-height: 252px;
            --icon-diameter: 57px;
            --icon-left: 31.5px;
            --icon-top: 27px;
            --rope-width: 6px;
            --rope-height: 33px;
            --thin-black-height: 3px;
            --gold-block-height: 10px;
            --gold-title-height: 52px;
            --gold-name-min-height: 36px;
            --columns: 12;
            --gap-h: 14px;
            --content-max-width: 1680px;
            --bg-image: url('img/background.png');
            --scale: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a0f;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 16px 0 30px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.22);
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: var(--content-max-width);
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex-shrink: 0;
        }

        .gold-bar {
            background: var(--gold);
            flex-shrink: 0;
            opacity: 0.92;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        .gold-bar.thin {
            height: var(--gold-block-height);
        }

        .gold-bar.title-bar {
            height: var(--gold-title-height);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        .content-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex-shrink: 0;
        }

        .row-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .plates-row.row-animate,
        .plates-row.row-animate-reverse {
            opacity: 0;
            animation-fill-mode: both;
        }

        .plates-row.row-animate {
            animation-name: slideInLeft;
            animation-duration: 0.9s;
            animation-timing-function: ease-out;
        }

        .plates-row.row-animate-reverse {
            animation-name: slideInRight;
            animation-duration: 0.9s;
            animation-timing-function: ease-out;
        }

        @keyframes slideInLeft {
            0%   { opacity: 0; transform: translateX(-35vw); }
            26%  { opacity: 1; transform: translateX(0); }
            52%  { transform: translateX(-8vw); }
            67%  { transform: translateX(0); }
            78%  { transform: translateX(-4vw); }
            89%  { transform: translateX(0); }
            96%  { transform: translateX(-2vw); }
            97%  { transform: translateX(0); }
            98%  { transform: translateX(-1vw); }
            99%  { transform: translateX(0); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            0%   { opacity: 0; transform: translateX(35vw); }
            26%  { opacity: 1; transform: translateX(0); }
            52%  { transform: translateX(8vw); }
            67%  { transform: translateX(0); }
            78%  { transform: translateX(4vw); }
            89%  { transform: translateX(0); }
            96%  { transform: translateX(2vw); }
            97%  { transform: translateX(0); }
            98%  { transform: translateX(1vw); }
            99%  { transform: translateX(0); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .black-line {
            height: var(--thin-black-height);
            background: var(--black);
            flex-shrink: 0;
            opacity: 0.9;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        .plates-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: var(--gap-h);
            flex-wrap: nowrap;
            width: 100%;
            padding: 0;
            flex-shrink: 0;
        }

        .plate-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: var(--plate-width);
            flex-shrink: 0;
        }

        .rope {
            width: var(--rope-width);
            height: var(--rope-height);
            background: var(--black);
            flex-shrink: 0;
            opacity: 0.9;
            margin: 0 auto;
            border-radius: 2px 2px 0 0;
            margin-bottom: -8px;
            position: relative;
            z-index: 1;
        }

        .empty-unit .rope {
            opacity: 0;
        }

        .plate {
            width: var(--plate-width);
            height: var(--plate-height);
            background-image: url('img/MiniPlate.png');
            background-size: var(--sprite-bg-width) var(--sprite-bg-height);
            background-repeat: no-repeat;
            position: relative;
            cursor: pointer;
            transition: transform 0.22s ease, filter 0.22s ease;
            filter: drop-shadow(3px 4px 7px rgba(0, 0, 0, 0.5));
            flex-shrink: 0;
            z-index: 2;
        }

        .plate:hover {
            transform: translateY(-6px);
            filter: drop-shadow(4px 8px 16px rgba(0, 0, 0, 0.6)) brightness(1.07);
            z-index: 10;
        }

        .plate:active {
            transform: translateY(-2px);
            transition: transform 0.06s ease;
        }

        .plate.style-1 { background-position: 0% 0; }
        .plate.style-2 { background-position: 20% 0; }
        .plate.style-3 { background-position: 40% 0; }
        .plate.style-4 { background-position: 60% 0; }
        .plate.style-5 { background-position: 79.8% 0; }
        .plate.style-6 { background-position: 99.85% 0; }

        .plate.empty-plate {
            cursor: default;
            opacity: 0;
            filter: drop-shadow(2px 3px 5px rgba(0, 0, 0, 0.3)) grayscale(10%);
        }
        .plate.empty-plate:hover {
            transform: none;
            filter: drop-shadow(2px 3px 5px rgba(0, 0, 0, 0.3)) grayscale(10%);
            cursor: default;
        }

        .plate .icon-circle {
            position: absolute;
            width: var(--icon-diameter);
            height: var(--icon-diameter);
            border-radius: 50%;
            overflow: hidden;
            left: var(--icon-left);
            top: var(--icon-top);
            background: rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.25);
        }

        .plate .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .plate.empty-plate .icon-circle { display: none; }

        .gold-name-row {
            background: var(--gold);
            opacity: 0.92;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: var(--gap-h);
            flex-wrap: nowrap;
            min-height: var(--gold-name-min-height);
            height: auto;
            flex-shrink: 0;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        .name-slot {
            width: var(--plate-width);
            text-align: center;
            flex-shrink: 0;
            color: var(--white);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            line-height: 1.2;
            padding: 2px 3px;
            user-select: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.45);
            transition: color 0.2s ease;
            cursor: default;
            /* 允许换行，优先空格处断开，最多两行 */
            white-space: normal;
            word-break: break-word;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .name-slot.has-link { cursor: pointer; }
        .name-slot.has-link:hover {
            color: #fffef0;
            text-shadow: 1px 1px 6px rgba(255, 255, 255, 0.5);
        }
        .name-slot.empty-name {
            opacity: 0;
            cursor: default;
        }

        .footer-gold {
            height: var(--gold-block-height);
            background: var(--gold);
            opacity: 0.92;
            flex-shrink: 0;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        /* 移动端自适应缩放 */
        @media (max-width: 768px) {
            :root {
                --columns: 6;
                --content-max-width: 100%;
                --bg-image: url('img/background.jpg');
            }

            body {
                padding: 0;
            }

            .main-container {
                padding: 0;
                width: 100%;
                max-width: 100%;
            }

            .gold-bar.title-bar {
                font-size: calc(21px * var(--scale));
                letter-spacing: 0.06em;
            }

            .plate {
                filter: drop-shadow(calc(2px * var(--scale)) calc(3px * var(--scale)) calc(4px * var(--scale)) rgba(0,0,0,0.5));
            }
            .plate:hover {
                transform: translateY(calc(-4px * var(--scale)));
                filter: drop-shadow(calc(3px * var(--scale)) calc(6px * var(--scale)) calc(10px * var(--scale)) rgba(0,0,0,0.55)) brightness(1.05);
            }
            .plate .icon-circle {
                border: calc(1.5px * var(--scale)) solid rgba(255,255,255,0.2);
                box-shadow: inset 0 0 calc(5px * var(--scale)) rgba(0,0,0,0.25);
            }
            .plate.empty-plate { opacity: 0; }

            .name-slot {
                font-size: calc(8.4px * var(--scale));
                letter-spacing: 0.02em;
            }

            .rope {
                border-radius: calc(1.5px * var(--scale)) calc(1.5px * var(--scale)) 0 0;
                margin-bottom: calc(-5px * var(--scale));
                position: relative;
                z-index: 1;
            }

            .content-area {
                max-height: none;
                overflow: visible;
                padding-bottom: 0;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="header">
            <div class="gold-bar thin"></div>
            <div class="gold-bar title-bar">TaikoNavigation</div>
            <div class="gold-bar thin"></div>
        </header>

        <div class="content-area" id="contentArea"></div>

        <div class="footer-gold"></div>
    </div>

    <script>
        (function() {
            const linksData = [];

            // ---------- 移动端自适应缩放 ----------
            function updateMobileScale() {
                const isMobile = window.innerWidth <= 768;
                const root = document.documentElement;

                if (!isMobile) {
                    root.style.setProperty('--scale', '1');
                    root.style.setProperty('--plate-width', '120px');
                    root.style.setProperty('--plate-height', '252px');
                    root.style.setProperty('--sprite-bg-width', '720px');
                    root.style.setProperty('--sprite-bg-height', '252px');
                    root.style.setProperty('--icon-diameter', '57px');
                    root.style.setProperty('--icon-left', '31.5px');
                    root.style.setProperty('--icon-top', '27px');
                    root.style.setProperty('--rope-width', '6px');
                    root.style.setProperty('--rope-height', '33px');
                    root.style.setProperty('--thin-black-height', '3px');
                    root.style.setProperty('--gold-block-height', '10px');
                    root.style.setProperty('--gold-title-height', '52px');
                    root.style.setProperty('--gold-name-min-height', '36px');
                    root.style.setProperty('--gap-h', '14px');
                    return;
                }

                // 移动端基准值（未缩放前的像素值）
                const BASE = {
                    plateWidth: 68,
                    plateHeight: 143,
                    iconDiameter: 32,
                    iconLeft: 18,
                    iconTop: 14.5,
                    ropeWidth: 4,
                    ropeHeight: 25,
                    thinBlack: 2.5,
                    goldBlock: 8,
                    titleHeight: 42,
                    nameMinHeight: 28,      // 两行文字区域最小高度
                    gapH: 7,
                    ropeMarginBottom: 5,
                };

                // 每行高度：黑线 + (有效绳索高度 + 板子高度) + 黑线 + 名称区域最小高度 + 黑线
                const effectiveRope = BASE.ropeHeight - BASE.ropeMarginBottom;
                const rowHeight = BASE.thinBlack + effectiveRope + BASE.plateHeight + BASE.thinBlack + BASE.nameMinHeight + BASE.thinBlack;
                const totalContentHeight = 5 * rowHeight;
                const totalHeaderFooter = BASE.goldBlock + BASE.titleHeight + BASE.goldBlock + BASE.goldBlock;
                const totalHeightBase = totalContentHeight + totalHeaderFooter;

                const totalWidthBase = BASE.plateWidth * 6 + BASE.gapH * 5 + 12;
                const vh = window.innerHeight;
                const vw = window.innerWidth;
                const scaleH = vh / totalHeightBase;
                const scaleW = vw / totalWidthBase;
                const scale = Math.min(scaleH, scaleW, 1.5);

                root.style.setProperty('--scale', scale);
                root.style.setProperty('--plate-width', `${BASE.plateWidth * scale}px`);
                root.style.setProperty('--plate-height', `${BASE.plateHeight * scale}px`);
                root.style.setProperty('--sprite-bg-width', `${BASE.plateWidth * 6 * scale}px`);
                root.style.setProperty('--sprite-bg-height', `${BASE.plateHeight * scale}px`);
                root.style.setProperty('--icon-diameter', `${BASE.iconDiameter * scale}px`);
                root.style.setProperty('--icon-left', `${BASE.iconLeft * scale}px`);
                root.style.setProperty('--icon-top', `${BASE.iconTop * scale}px`);
                root.style.setProperty('--rope-width', `${BASE.ropeWidth * scale}px`);
                root.style.setProperty('--rope-height', `${BASE.ropeHeight * scale}px`);
                root.style.setProperty('--thin-black-height', `${BASE.thinBlack * scale}px`);
                root.style.setProperty('--gold-block-height', `${BASE.goldBlock * scale}px`);
                root.style.setProperty('--gold-title-height', `${BASE.titleHeight * scale}px`);
                root.style.setProperty('--gold-name-min-height', `${BASE.nameMinHeight * scale}px`);
                root.style.setProperty('--gap-h', `${BASE.gapH * scale}px`);
            }

            function getConfig() {
                const isMobile = window.innerWidth <= 768;
                return {
                    columns: isMobile ? 6 : 12,
                    defaultRows: isMobile ? 5 : 2,
                    isMobile: isMobile,
                };
            }

            function escapeHTML(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function createPlateHTML(linkData, index) {
                const hasLink = linkData && linkData.url;
                const styleNum = linkData ? linkData.style : ((index % 6) + 1);
                const iconSrc = linkData && linkData.icon ? 'img/icon/' + linkData.icon : '';
                const name = linkData ? linkData.name : '';
                const url = linkData ? linkData.url : '';
                const desc = linkData ? (linkData.desc || '') : '';
                const isEmpty = !hasLink;

                const plateClass = 'plate style-' + styleNum + (isEmpty ? ' empty-plate' : '');
                let html = '<div class="plate-unit' + (hasLink ? '' : ' empty-unit') + '">';
                html += '<div class="rope"></div>';
                html += '<div class="' + plateClass + '"';
                if (hasLink && desc) {
                    html += ' title="' + escapeHTML(desc) + '"';
                }
                if (hasLink) {
                    html += ' onclick="window.open(\'' + escapeHTML(url) + '\', \'_blank\')" style="cursor:pointer;"';
                }
                html += '>';
                if (hasLink && iconSrc) {
                    html += '<div class="icon-circle">';
                    html += '<img src="' + escapeHTML(iconSrc) + '" alt="' + escapeHTML(name) + '" loading="lazy" onerror="this.style.display=\'none\'">';
                    html += '</div>';
                }
                html += '</div>';
                html += '</div>';
                return html;
            }

            function createNameHTML(linkData) {
                const hasLink = linkData && linkData.url;
                const name = linkData ? linkData.name : '';
                const url = linkData ? linkData.url : '';
                const cls = 'name-slot' + (hasLink ? ' has-link' : ' empty-name');
                let html = '<span class="' + cls + '"';
                if (hasLink) {
                    html += ' onclick="window.open(\'' + escapeHTML(url) + '\', \'_blank\')" style="cursor:pointer;"';
                }
                html += '>' + escapeHTML(name) + '</span>';
                return html;
            }

            function renderAll() {
                updateMobileScale();

                const config = getConfig();
                const columns = config.columns;
                const defaultRows = config.defaultRows;
                const totalLinks = linksData.length;
                const minSlots = Math.max(defaultRows * columns, totalLinks);
                const rows = Math.ceil(minSlots / columns);
                const totalSlots = rows * columns;

                const allSlots = [];
                for (let i = 0; i < totalSlots; i++) {
                    allSlots.push(i < totalLinks ? linksData[i] : null);
                }

                const contentArea = document.getElementById('contentArea');
                let html = '';

                for (let row = 0; row < rows; row++) {
                    const rowSlots = allSlots.slice(row * columns, (row + 1) * columns);
                    const directionClass = (row % 2 === 0) ? 'row-animate' : 'row-animate-reverse';

                    html += '<div class="row-group">';
                    html += '<div class="black-line"></div>';
                    html += '<div class="plates-row ' + directionClass + '">';
                    for (let col = 0; col < columns; col++) {
                        html += createPlateHTML(rowSlots[col] || null, row * columns + col);
                    }
                    html += '</div>';
                    html += '<div class="black-line"></div>';
                    html += '<div class="gold-name-row">';
                    for (let col = 0; col < columns; col++) {
                        html += createNameHTML(rowSlots[col] || null);
                    }
                    html += '</div>';
                    html += '<div class="black-line"></div>';
                    html += '</div>';
                }

                contentArea.innerHTML = html;
            }

            (async function loadData() {
                try {
                    const response = await fetch('data.xlsx');
                    if (!response.ok) throw new Error('Network error');
                    const arrayBuffer = await response.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    
                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length === 0) continue;
                        linksData.push({
                            name: row[0] || '',
                            url:  row[1] || '',
                            desc: row[2] || '',
                            icon: row[3] || '',
                            style: parseInt(row[4]) || 1
                        });
                    }
                } catch (e) {
                    console.error('加载 data.xlsx 出错', e);
                } finally {
                    renderAll();
                }
            })();

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(function() {
                    const isMobile = window.innerWidth <= 768;
                    const wasMobile = (document.documentElement.style.getPropertyValue('--columns') === '6');
                    if (isMobile !== wasMobile) {
                        renderAll();
                    } else {
                        updateMobileScale();
                    }
                }, 250);
            });

            document.addEventListener('error', function(e) {
                if (e.target && e.target.tagName === 'IMG' && e.target.closest('.icon-circle')) {
                    e.target.style.display = 'none';
                }
            }, true);
        })();
    </script>
</body>
</html>
