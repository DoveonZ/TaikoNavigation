<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>TaikoNavigation - 太鼓达人导航</title>
    <!-- 解析 data.xlsx 用的 SheetJS。以前直接引 cdn.sheetjs.com，
         那个域名一旦握手超时整个导航页就只剩"无法加载 data.xlsx"。
         现在改成自带一份（vendor/xlsx.full.min.js），
         万一本地那份丢了，脚本里还会自动去 CDN 兜一次底。 -->
    <script src="vendor/xlsx.full.min.js"></script>
    <style>
        :root {
            --gold: #cc9c56;
            --black: #000000;
            --white: #ffffff;
            --plate-width: 120px;
            --plate-height: 252px;
            --sprite-bg-width: 720px;
            --sprite-bg-height: 252px;
            --icon-diameter: 57px;
            --icon-left: 31.5px;
            --icon-top: 27px;
            --rope-width: 6px;
            --rope-height: 33px;
            --thin-black-height: 3px;
            --gold-block-height: 10px;
            --gold-title-height: 52px;
            --gold-name-min-height: 36px;
            --row-title-height: 34px;
            --columns: 12;
            --gap-h: 14px;
            --content-max-width: 1680px;
            --bg-image: url('img/background.png');
            --scale: 1;

            /* 弹窗切换动画。基准 0.1667s ≈ 60fps 下的 10 帧（原 20 帧的速度两倍），
               进度曲线仍是前 6 成匀速、后 4 成匀减速到 0。
               --modal-speed 是速度倍率（>1 更快），调试面板可实时调并缓存到 localStorage。 */
            --modal-speed: 1;
            --modal-switch-dur: calc(0.1667s / var(--modal-speed));
            --modal-fade-in-dur: calc(0.16s / var(--modal-speed));
            --modal-fade-out-dur: calc(0.24s / var(--modal-speed));

            /* 图标微调偏移：下标 1~6 对应底板样式 .plate.style-1 ~ .plate.style-6。
               下面这组只是脚本未执行时的兜底值（= PC 端数值，--scale 恒为 1）。
               运行时的实际数值来自脚本里的 DEFAULT_ICON_OFFSETS：
               PC 端与移动端各一组，单位是"底板基准像素"，由脚本乘以 --scale 后
               写入这几个变量，因此移动端换屏幕尺寸时偏移量会等比缩放。
               数值可用 Ctrl+Shift+P 调试面板现场校准（见文件末尾的调试脚本）。 */
            --icon-dx-1: -0.1px;  --icon-dy-1: -0.6px;
            --icon-dx-2: 1.3px;   --icon-dy-2: -0.6px;
            --icon-dx-3: 2.2px;   --icon-dy-3: -0.6px;
            --icon-dx-4: 0.2px;   --icon-dy-4: -0.4px;
            --icon-dx-5: 0.3px;   --icon-dy-5: -1px;
            --icon-dx-6: 1.3px;   --icon-dy-6: -0.5px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a0f;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 16px 0 30px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.22);
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: var(--content-max-width);
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex-shrink: 0;
        }

        .gold-bar {
            background: var(--gold);
            flex-shrink: 0;
            opacity: 0.92;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }
        .gold-bar.thin { height: var(--gold-block-height); }
        .gold-bar.title-bar {
            height: var(--gold-title-height);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        /* ========== 多页面（工作表）切换标签栏 ========== */
        .tabs-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex-shrink: 0;
        }
        .sheet-tabs {
            width: 100vw;
            margin-left: calc(50% - 50vw);
            background: var(--gold);
            opacity: 0.92;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 6px 12px;
            flex-shrink: 0;
        }
        .sheet-tabs[hidden] { display: none; }

        .sheet-tab {
            appearance: none;
            -webkit-appearance: none;
            border: 2px solid rgba(0, 0, 0, 0.35);
            background: rgba(0, 0, 0, 0.18);
            color: var(--white);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            line-height: 1.2;
            padding: 5px 20px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.35);
            transition: background 0.2s ease, color 0.2s ease;
        }
        .sheet-tab:hover { background: rgba(0, 0, 0, 0.4); }
        .sheet-tab.active {
            background: var(--black);
            border-color: var(--black);
            color: var(--gold);
            text-shadow: none;
        }
        .sheet-tab:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 2px;
        }

        .load-error {
            width: 100vw;
            margin-left: calc(50% - 50vw);
            background: rgba(0, 0, 0, 0.62);
            color: var(--white);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-align: center;
            padding: 28px 16px;
        }

        .content-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex-shrink: 0;
        }

        .row-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .plates-row.row-animate,
        .plates-row.row-animate-reverse {
            opacity: 0;
            animation-fill-mode: both;
        }
        .plates-row.row-animate {
            animation-name: slideInLeft;
            animation-duration: 0.9s;
            animation-timing-function: ease-out;
        }
        .plates-row.row-animate-reverse {
            animation-name: slideInRight;
            animation-duration: 0.9s;
            animation-timing-function: ease-out;
        }
        @keyframes slideInLeft {
            0%   { opacity: 0; transform: translateX(-35vw); }
            26%  { opacity: 1; transform: translateX(0); }
            52%  { transform: translateX(-8vw); }
            67%  { transform: translateX(0); }
            78%  { transform: translateX(-4vw); }
            89%  { transform: translateX(0); }
            96%  { transform: translateX(-2vw); }
            97%  { transform: translateX(0); }
            98%  { transform: translateX(-1vw); }
            99%  { transform: translateX(0); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            0%   { opacity: 0; transform: translateX(35vw); }
            26%  { opacity: 1; transform: translateX(0); }
            52%  { transform: translateX(8vw); }
            67%  { transform: translateX(0); }
            78%  { transform: translateX(4vw); }
            89%  { transform: translateX(0); }
            96%  { transform: translateX(2vw); }
            97%  { transform: translateX(0); }
            98%  { transform: translateX(1vw); }
            99%  { transform: translateX(0); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .black-line {
            height: var(--thin-black-height);
            background: var(--black);
            flex-shrink: 0;
            opacity: 0.9;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        /* ========== 分区行标题（data.xlsx 中 style 列写 linetitle 的行） ==========
           标题条是通栏的金底白字，文字居中。
           分区里的图板行仍按整行 columns 个槽位排（与普通行完全一致），
           因此第一块图板正好落在"正常排列时第一列"的位置上，
           空出来的槽位由 .plate.empty-plate 的暗置底板填满。 */
        .row-title-bar {
            height: var(--row-title-height);
            background: var(--gold);
            opacity: 0.92;
            flex-shrink: 0;
            width: 100vw;
            margin-left: calc(50% - 50vw);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .row-title {
            color: var(--white);
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            padding: 0 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.45);
        }

        .plates-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: var(--gap-h);
            flex-wrap: nowrap;
            width: 100%;
            padding: 0;
            flex-shrink: 0;
        }

        .plate-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: var(--plate-width);
            flex-shrink: 0;
        }

        .rope {
            width: var(--rope-width);
            height: var(--rope-height);
            background: var(--black);
            flex-shrink: 0;
            opacity: 0.9;
            margin: 0 auto;
            border-radius: 2px 2px 0 0;
            margin-bottom: -8px;
            position: relative;
            z-index: 1;
        }
        .empty-unit .rope { opacity: 0.28; }

        .plate {
            width: var(--plate-width);
            height: var(--plate-height);
            background-image: url('img/MiniPlate.png');
            background-size: var(--sprite-bg-width) var(--sprite-bg-height);
            background-repeat: no-repeat;
            position: relative;
            cursor: pointer;
            transition: transform 0.22s ease, filter 0.22s ease;
            filter: drop-shadow(3px 4px 7px rgba(0, 0, 0, 0.5));
            flex-shrink: 0;
            z-index: 2;
        }
        .plate:hover {
            transform: translateY(-6px);
            filter: drop-shadow(4px 8px 16px rgba(0, 0, 0, 0.6)) brightness(1.07);
            z-index: 10;
        }
        .plate:active {
            transform: translateY(-2px);
            transition: transform 0.06s ease;
        }

        .plate.style-1 { background-position: 0% 0; }
        .plate.style-2 { background-position: 20% 0; }
        .plate.style-3 { background-position: 40% 0; }
        .plate.style-4 { background-position: 60% 0; }
        .plate.style-5 { background-position: 80% 0; }
        .plate.style-6 { background-position: 100% 0; }

        .plate.empty-plate {
            cursor: default;
            /* 空槽位也画一块底板，但压暗去色退到背景里：
               整行因此保持完整的排列节奏（六种底板按列数 12/6 循环，正好整除）。 */
            opacity: 0.32;
            filter: drop-shadow(2px 3px 5px rgba(0, 0, 0, 0.25)) grayscale(45%) brightness(0.62);
        }
        .plate.empty-plate:hover {
            transform: none;
            filter: drop-shadow(2px 3px 5px rgba(0, 0, 0, 0.25)) grayscale(45%) brightness(0.62);
            cursor: default;
        }

        .plate .icon-circle {
            position: absolute;
            width: var(--icon-diameter);
            height: var(--icon-diameter);
            border-radius: 50%;
            overflow: hidden;
            left: var(--icon-left);
            top: var(--icon-top);
            background: rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.25);
        }
        .plate .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .plate.empty-plate .icon-circle { display: none; }

        /* ========== 图标精准对齐 ==========
           --icon-dx-N / --icon-dy-N 是各底板样式的图标微调量（已由脚本按 --scale 换算成像素），
           直接叠加在 --icon-left / --icon-top 上。PC 端与移动端各有一组数值，
           由脚本按窗口宽度自动切换。 */
        .plate.style-1 .icon-circle { left: calc(var(--icon-left) + var(--icon-dx-1)); top: calc(var(--icon-top) + var(--icon-dy-1)); }
        .plate.style-2 .icon-circle { left: calc(var(--icon-left) + var(--icon-dx-2)); top: calc(var(--icon-top) + var(--icon-dy-2)); }
        .plate.style-3 .icon-circle { left: calc(var(--icon-left) + var(--icon-dx-3)); top: calc(var(--icon-top) + var(--icon-dy-3)); }
        .plate.style-4 .icon-circle { left: calc(var(--icon-left) + var(--icon-dx-4)); top: calc(var(--icon-top) + var(--icon-dy-4)); }
        .plate.style-5 .icon-circle { left: calc(var(--icon-left) + var(--icon-dx-5)); top: calc(var(--icon-top) + var(--icon-dy-5)); }
        .plate.style-6 .icon-circle { left: calc(var(--icon-left) + var(--icon-dx-6)); top: calc(var(--icon-top) + var(--icon-dy-6)); }

        .gold-name-row {
            background: var(--gold);
            opacity: 0.92;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: var(--gap-h);
            flex-wrap: nowrap;
            min-height: var(--gold-name-min-height);
            height: auto;
            flex-shrink: 0;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        .name-slot {
            width: var(--plate-width);
            text-align: center;
            flex-shrink: 0;
            color: var(--white);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            line-height: 1.2;
            padding: 2px 3px;
            user-select: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.45);
            transition: color 0.2s ease;
            cursor: default;
            white-space: normal;
            word-break: break-word;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .name-slot.has-link { cursor: pointer; }
        .name-slot.has-link:hover {
            color: #fffef0;
            text-shadow: 1px 1px 6px rgba(255, 255, 255, 0.5);
        }
        .name-slot.empty-name { opacity: 0; cursor: default; }

        .footer-gold {
            height: var(--gold-block-height);
            background: var(--gold);
            opacity: 0.92;
            flex-shrink: 0;
            /* .main-container 是 align-items:center 的纵向 flex 容器，若不指定对齐方式，
               这条 100vw 的通栏金条会先被居中、再叠加 calc(50% - 50vw) 的负外边距，
               等于偏移了两次，右端会短一截。固定到 flex-start 后，
               与 .header / .tabs-bar 内部的通栏元素用同一套算法，三者左右完全对齐。 */
            align-self: flex-start;
            width: 100vw;
            margin-left: calc(50% - 50vw);
        }

        /* ==========================================================================
           网页速览弹窗（点击图板打开）

           画面全部由现有素材拼装，没有额外画图：
             · Panel.png            外框。用 border-image 九宫格切：上下左右各切到
                                    内框底色的起始位置（上 25 / 右 27 / 下 28 / 左 20），
                                    于是 border 内侧恰好等于素材里的米色内框，
                                    边角与描边保持素材原样，中间随内容拉伸。
             · Panel_Side.png       精灵图，240×806 = 6 帧 ×40px，每帧一种底板配色。
                                    按被点击图板的 style 取帧，贴在面板内框最左侧当装饰条。
             · MiniPlate.png        左侧挂牌，取与图板同款的帧，圆槽里放该网站的图标。
             · GaugeCondition_Bar.png  下方三张卡位（后续放每个网页的 16:9 预览图）。

           所有尺寸 = 素材原始像素 × --k。--k 由脚本按视口算出（桌面端挂牌与面板并排，
           窄屏改为上下堆叠并单独放大挂牌），因此任何屏幕下各素材的比例都保持一致。
           文字用 clamp() 兜底，避免小屏时等比缩到看不清。
           ========================================================================== */
        body.modal-open { overflow: hidden; }

        .site-modal {
            position: fixed;
            inset: 0;
            z-index: 900;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 16px 12px;
            background: rgba(10, 8, 4, 0.66);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            /* 纵向滚动保留，横向裁掉：入场时整块弹窗停在视口右侧外面，
               若不裁掉横向溢出会短暂顶出一条横向滚动条。 */
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            /* 滚到底/顶时不要把滚动传给背后的导航页 */
            overscroll-behavior: contain;
            opacity: 0;
            transition: opacity var(--modal-fade-in-dur) ease;
            --k: 1;
            --pk: 1;
            --idx: 0;
            --ink: #503c2d;          /* Panel.png 里内框与圆角标签的描边色 */
            --panel-fill: #f8f5e1;   /* Panel.png 里内框的底色 */
        }
        .site-modal[hidden] { display: none; }
        .site-modal.show { opacity: 1; }
        /* 退场时遮罩要留到最后，否则弹窗还没淡走背景就已经亮回来了 */
        .site-modal.closing { transition: opacity var(--modal-fade-out-dur) ease; }
        /* 翻页：遮罩必须一直不透明，只有弹窗本身在换 */
        .site-modal.paging { opacity: 1; }

        /* 推入距离：入场起点 / 退场终点 / 翻页时新旧两块的间距都用它。
           一块的宽度 ≈ 1870 素材像素（含箭头留白与块间空隙），
           于是入场那块恰好停在屏幕右侧外一点点 ——
           即"后入者把原有者推出去"：两块刚性并排、相对静止地平移，不是叠化。
           翻页时脚本会把 --push-in / --push-out 按方向对调。 */
        .site-modal {
            --push: calc(1870px * var(--k));
            --push-in: var(--push);
            --push-out: calc(-1 * var(--push));
            /* 切换动画的进度曲线：0~60% 匀速走到 0.75，60~100% 匀减速补完剩余 0.25。
               匀速段速度 = 0.75/0.6 = 1.25，减速段初速 1.25、末速 0，
               位移 = 1.25×0.4/2 = 0.25，正好收尾。 */
            --switch-ease: linear(0, 0.75 60%, 0.8086 65%, 0.8594 70%, 0.9023 75%,
                                  0.9375 80%, 0.9648 85%, 0.9844 90%, 0.9961 95%, 1);
        }

        /* 跟着弹窗一起被推入 / 推出的部分：左侧挂牌、面板。
           底部提示文字刻意不在这个名单里 —— 它不参与动画，始终停在原处。
           刻意用 translate（而不是包一层 transform 的容器）：
           翻页箭头也不在这个名单里，所以切换时它俩留在原地不动；
           挂牌自己的悬停上浮仍旧走 transform，两者互不干扰。
           选择器写成"舞台的直接子链"，这样翻页时那份克隆（嵌在 .site-modal-ghost 里，
           深一层）不会被这些规则命中 —— 否则克隆里的挂牌会被多推一次。
           transition 里先写 cubic-bezier 兜底，下面再用 linear() 覆盖；
           不认识 linear() 的浏览器会整条丢弃，退回上面的贝塞尔近似。 */
        .site-modal-stage > .site-modal-main > .site-modal-plate,
        .site-modal-stage > .site-modal-main > .site-modal-panel {
            translate: var(--push-in) 0;
            transition: translate var(--modal-switch-dur) cubic-bezier(0.4, 0.5, 0.7, 1);
            transition-timing-function: linear(0, 0.75 60%, 0.8086 65%, 0.8594 70%,
                        0.9023 75%, 0.9375 80%, 0.9648 85%, 0.9844 90%, 0.9961 95%, 1);
        }
        /* 换内容瞬间不带动画地把新内容摆到入场起点 */
        .site-modal.paging-snap .site-modal-stage > .site-modal-main > .site-modal-plate,
        .site-modal.paging-snap .site-modal-stage > .site-modal-main > .site-modal-panel { transition: none !important; }

        .site-modal-stage {
            position: relative;      /* 翻页时叠加的"上一块"用它定位 */
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(20px * var(--k));
        }
        /* 翻页时叠在旁边的"上一块"：整块克隆，和新的那块朝同一方向平移同样的距离。
           两块始终隔着一个 --push，互相保持相对静止 —— 就是被推出去的感觉；
           被推走的那块同时淡出，新块不透明地推入。 */
        .site-modal-ghost {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(20px * var(--k));
            pointer-events: none;
            translate: 0 0;
            opacity: 1;
            transition: translate var(--modal-switch-dur) cubic-bezier(0.4, 0.5, 0.7, 1),
                        opacity var(--modal-switch-dur) cubic-bezier(0.4, 0.5, 0.7, 1);
            transition-timing-function: linear(0, 0.75 60%, 0.8086 65%, 0.8594 70%,
                        0.9023 75%, 0.9375 80%, 0.9648 85%, 0.9844 90%, 0.9961 95%, 1);
        }
        .site-modal.paging .site-modal-ghost {
            translate: var(--push-out) 0;
            opacity: 0;
        }
        /* 箭头和提示只有一份（真正的那份不动），克隆里的这两样藏掉免得重影 */
        .site-modal-ghost .site-arrow,
        .site-modal-ghost .site-modal-hint { visibility: hidden; }

        /* 挂牌 + 面板（+ 桌面端两侧的翻页箭头）这一行 */
        .site-modal-main {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            /* 挂牌最小侧本身带约 17px 透明边，加上这里的间距即得素材里的视觉间隔 */
            gap: calc(12px * var(--k));
        }
        /* 面板下方的操作提示（没有关闭按钮，得让人知道怎么退出去） */
        .site-modal-hint {
            color: rgba(248, 245, 225, 0.68);
            font-size: clamp(12px, calc(20px * var(--k)), 20px);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-indent: 0.14em;   /* 抵消字距在末尾留下的空隙，保持居中 */
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            user-select: none;
        }
        .site-modal.show .site-modal-stage > .site-modal-main > .site-modal-plate,
        .site-modal.show .site-modal-stage > .site-modal-main > .site-modal-panel {
            translate: 0 0;
        }
        /* 翻页：新的一块先被无过渡地摆到入场起点（写在 .show 之后才会生效），
           随后和旧块一起朝同一方向平移同样的距离 —— 旧块被推出，新块推入。 */
        .site-modal.paging-in .site-modal-stage > .site-modal-main > .site-modal-plate,
        .site-modal.paging-in .site-modal-stage > .site-modal-main > .site-modal-panel {
            translate: var(--push-in) 0;
        }
        /* 关闭：向左推出 */
        .site-modal.closing .site-modal-stage > .site-modal-main > .site-modal-plate,
        .site-modal.closing .site-modal-stage > .site-modal-main > .site-modal-panel {
            translate: calc(-1 * var(--push)) 0;
        }

        /* ---------- 左侧挂牌：MiniPlate.png 取帧 ---------- */
        .site-modal-plate {
            position: relative;
            flex-shrink: 0;
            width: calc(230px * var(--pk));
            height: calc(482px * var(--pk));
            margin-top: calc(34px * var(--pk));
            background-image: url('img/MiniPlate.png');
            background-repeat: no-repeat;
            background-size: calc(1380px * var(--pk)) calc(482px * var(--pk));
            background-position: calc(var(--idx) * -230px * var(--pk)) 0;
            filter: drop-shadow(calc(3px * var(--pk)) calc(5px * var(--pk)) calc(9px * var(--pk)) rgba(0, 0, 0, 0.5));
            /* 整块挂牌就是"直接访问该网页"的按钮 */
            cursor: pointer;
            /* translate 走弹窗推入，transform / filter 走悬停上浮 ——
               三条都要列全，否则后写的这条会把上面那条的位移过渡顶掉。
               timing function 按属性顺序给：第一条用切换曲线，后两条给 ease。 */
            transition: translate var(--modal-switch-dur) cubic-bezier(0.4, 0.5, 0.7, 1),
                        transform 0.22s ease, filter 0.22s ease;
            transition-timing-function: linear(0, 0.75 60%, 0.8086 65%, 0.8594 70%,
                        0.9023 75%, 0.9375 80%, 0.9648 85%, 0.9844 90%, 0.9961 95%, 1),
                        ease, ease;
        }
        .site-modal-plate:hover {
            transform: translateY(calc(-8px * var(--pk)));
            filter: drop-shadow(calc(4px * var(--pk)) calc(9px * var(--pk)) calc(15px * var(--pk)) rgba(0, 0, 0, 0.58)) brightness(1.08);
        }
        .site-modal-plate:active {
            transform: translateY(calc(-3px * var(--pk)));
            transition: transform 0.06s ease;
        }

        /* ---------- 左右翻页箭头 ----------
           Plate_Arrow.png 是一张 56×72 的左向箭头（不是精灵图），右向用水平镜像。
           两个按钮都是 .site-modal-main 的直接子项（不套中转容器），
           这样桌面端能排在挂牌两侧并参与 --k 的宽度计算，
           窄屏靠 flex-wrap 换行就能变成"夹在挂牌两侧、面板另起一行"。 */
        .site-modal.no-paging .site-arrow { display: none; }

        .site-arrow {
            --flip: 1;
            --zoom: 1;
            flex-shrink: 0;
            align-self: center;
            /* 抬到翻页克隆之上，否则会被推出去的那一块盖住 */
            position: relative;
            z-index: 3;
            width: calc(56px * var(--k));
            aspect-ratio: 56 / 72;
            padding: 0;
            appearance: none;
            -webkit-appearance: none;
            border: none;
            background: url('img/Plate_Arrow.png') center / contain no-repeat;
            cursor: pointer;
            transform: scaleX(var(--flip)) scale(var(--zoom));
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
            transition: transform 0.18s ease, filter 0.18s ease, opacity 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .site-arrow:hover {
            --zoom: 1.12;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.55)) brightness(1.12);
        }
        .site-arrow:active { --zoom: 0.94; }
        .site-arrow:focus-visible {
            outline: 2px solid var(--panel-fill);
            outline-offset: 3px;
            border-radius: 6px;
        }
        .site-arrow:disabled {
            --zoom: 1;
            opacity: 0.26;
            cursor: default;
            filter: none;
        }
        .site-arrow-prev { margin-right: calc(16px * var(--k)); }
        .site-arrow-next {
            --flip: -1;
            order: 9;                              /* 排到面板右侧 */
            margin-left: calc(16px * var(--k));
        }
        .site-modal-plate .icon-circle {
            position: absolute;
            /* 与导航图板同一套比例：基准图板 120×252 时是 31.5 / 27 / 57，
               换算到素材原始尺寸 230×482 即下面这三个数（乘 --pk 缩放）。 */
            left: calc(60.4px * var(--pk));
            top: calc(51.75px * var(--pk));
            width: calc(109.25px * var(--pk));
            height: calc(109.25px * var(--pk));
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.12);
            border: calc(2px * var(--pk)) solid rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 0 calc(8px * var(--pk)) rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }
        .site-modal-plate .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ---------- 面板：Panel.png 九宫格外框 ---------- */
        .site-modal-panel {
            position: relative;
            box-sizing: border-box;
            width: calc(1522px * var(--k));
            min-height: calc(770px * var(--k));
            /* 兜底：个别内嵌/移动端浏览器上报的可视宽度可能比实际大，
               这里再按真实视口收一次，保证面板永远不会横向溢出。 */
            max-width: calc(100vw - 24px);
            border-style: solid;
            border-width: calc(25px * var(--k)) calc(27px * var(--k)) calc(28px * var(--k)) calc(20px * var(--k));
            border-image-source: url('img/Panel.png');
            border-image-slice: 25 27 28 20;
            border-image-repeat: stretch;
            /* 内框底色：素材里由 #f8f5e1 到底部 #e8e6d3 有极轻微的竖向渐变 */
            background-color: var(--panel-fill);
            background-image: linear-gradient(#f8f5e1, #e8e6d3);
            background-clip: padding-box;
            display: flex;
            flex-direction: column;
        }

        /* ---------- 左右装饰条：Panel_Side.png 按 style 取帧，两侧各贴一条 ---------- */
        .site-modal-stripe {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: calc(40px * var(--k));
            background-image: url('img/Panel_Side.png');
            background-repeat: no-repeat;
            background-size: calc(240px * var(--k)) 100%;
            background-position: calc(var(--idx) * -40px * var(--k)) 0;
            pointer-events: none;
        }
        /* 右侧同款一条。用 scaleX(-1) 水平翻转，让两侧花纹沿中轴对称
           （与 example.png 里左右两条的走向一致）。
           右移 1 个素材像素：Panel.png 内框右缘那一列还是底色，
           贴 right:0 会在花纹和黑框之间留下一条浅色缝。 */
        .site-modal-stripe.stripe-right {
            left: auto;
            right: calc(-1px * var(--k));
            transform: scaleX(-1);
        }

        /* ---------- 顶部介绍区 ---------- */
        .site-modal-head {
            position: relative;
            z-index: 1;
            min-height: calc(300px * var(--k));
            /* 左右各留出"装饰条 40 + 间隙 48"，文字不会压到两侧花纹上 */
            padding: calc(46px * var(--k)) calc(88px * var(--k)) calc(20px * var(--k)) calc(88px * var(--k));
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(6px, calc(16px * var(--k)), 16px);
        }
        .site-modal-title {
            color: #2b2620;
            font-size: clamp(16px, calc(34px * var(--k)), 34px);
            font-weight: 900;
            letter-spacing: 0.04em;
            line-height: 1.25;
            word-break: break-word;
        }
        .site-modal-desc {
            color: #3b3630;
            font-size: clamp(14px, calc(28px * var(--k)), 28px);
            font-weight: 400;
            line-height: 1.45;
            letter-spacing: 0.02em;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .site-modal-visit {
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            max-width: 100%;
            /* 纵向内边距不能完全跟着 --k 缩，否则手机上会变成一个点不中的细条 */
            padding: clamp(7px, calc(8px * var(--k)), 8px) clamp(14px, calc(22px * var(--k)), 22px);
            border-radius: 999px;
            background: rgba(80, 60, 45, 0.1);
            color: var(--ink);
            font-size: clamp(13px, calc(20px * var(--k)), 20px);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            transition: background 0.2s ease;
        }
        .site-modal-visit:hover { background: rgba(80, 60, 45, 0.24); }
        .site-modal-visit-host {
            font-weight: 400;
            opacity: 0.75;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- 圆角标签 + 内容框（Panel.png 里的深棕标签与内框） ---------- */
        .site-modal-body {
            position: relative;
            z-index: 1;
            margin: 0 calc(56px * var(--k));
        }
        .site-modal-tab {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: calc(409px * var(--k));
            min-width: fit-content;
            min-height: calc(35px * var(--k));
            padding: calc(4px * var(--k)) clamp(10px, calc(24px * var(--k)), 24px);
            margin-bottom: calc(-2px * var(--k));
            background: var(--ink);
            color: var(--panel-fill);
            border-radius: max(5px, calc(12px * var(--k))) max(5px, calc(12px * var(--k))) 0 0;
            font-size: clamp(12px, calc(20px * var(--k)), 20px);
            font-weight: 700;
            letter-spacing: 0.16em;
            text-indent: 0.16em;   /* 抵消字距在末尾留下的空隙，让文字保持居中 */
            white-space: nowrap;
            user-select: none;
        }
        .site-modal-body-box {
            position: relative;
            border: max(1px, calc(2px * var(--k))) solid var(--ink);
            border-radius: 0 max(8px, calc(24px * var(--k))) max(8px, calc(24px * var(--k))) max(8px, calc(24px * var(--k)));
            background: var(--panel-fill);
            min-height: calc(417px * var(--k));
        }

        /* ---------- 下方卡位：GaugeCondition_Bar.png ---------- */
        .site-modal-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: calc(40px * var(--k));
            padding: calc(90px * var(--k)) 0;
        }
        .site-modal-card {
            position: relative;
            aspect-ratio: 333 / 184;   /* = GaugeCondition_Bar.png 的原始比例，保证不拉伸变形 */
            background-image: url('img/GaugeCondition_Bar.png');
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }
        /* 每张卡片里预留的 16:9 预览图位。现在没有图片，保持透明；
           后续给对应卡片设置 background-image 即可（background-size: contain 会保持 16:9 不被裁切）。 */
        .site-modal-shot {
            position: absolute;
            left: 3%;
            top: 11%;
            width: 94%;
            height: 82%;
            border-radius: max(6px, calc(22px * var(--k)));
            overflow: hidden;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }

        /* 没有关闭按钮：点面板以外的空白处即可退出（见脚本里的遮罩点击） */

        /* 窄屏：翻页箭头夹到挂牌两侧，面板另起一行；
           卡片两列（列数少了弹窗会高得放不进 16:9 手机屏）。 */
        @media (max-width: 760px) {
            .site-modal {
                padding: 10px 6px;
                /* 移动端关掉背景模糊：整块弹窗是滑入的，模糊层每帧都要重绘，低端机容易掉帧。
                   改用更实的底色补偿观感。 */
                -webkit-backdrop-filter: none;
                backdrop-filter: none;
                background: rgba(10, 8, 4, 0.74);
            }
            .site-modal-stage { gap: calc(12px * var(--k)); }
            /* 让箭头和挂牌排一行、面板被挤到下一行 */
            .site-modal-main {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                column-gap: calc(14px * var(--k));
                row-gap: calc(12px * var(--k));
            }
            .site-modal-plate { margin-top: 0; }
            /* 换行后箭头要留在挂牌左右，所以把面板的次序推到它们后面 */
            .site-modal-panel {
                max-width: calc(100vw - 12px);
                order: 9;
            }
            /* 窄屏下 --k 很小，箭头要保一个能点中的下限 */
            .site-arrow { width: max(44px, calc(56px * var(--k))); }
            .site-arrow-prev { margin-right: 0; }
            .site-arrow-next { margin-left: 0; order: 0; }
            /* 手机屏幕窄：介绍区上下收一收，别把卡片挤到首屏之外 */
            .site-modal-head {
                min-height: calc(200px * var(--k));
                padding: calc(28px * var(--k)) calc(80px * var(--k)) calc(14px * var(--k)) calc(80px * var(--k));
            }
            .site-modal-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: calc(30px * var(--k));
                padding: calc(30px * var(--k)) 0;
            }
            .site-modal-hint { font-size: 12px; }
        }

        @media (max-width: 768px) {
            :root {
                --columns: 6;
                --content-max-width: 100%;
                --bg-image: url('img/background.jpg');
            }
            body { padding: 0; }
            .main-container { padding: 0; width: 100%; max-width: 100%; }
            .gold-bar.title-bar { font-size: calc(21px * var(--scale)); letter-spacing: 0.06em; }
            .plate {
                filter: drop-shadow(calc(2px * var(--scale)) calc(3px * var(--scale)) calc(4px * var(--scale)) rgba(0,0,0,0.5));
            }
            .plate:hover {
                transform: translateY(calc(-4px * var(--scale)));
                filter: drop-shadow(calc(3px * var(--scale)) calc(6px * var(--scale)) calc(10px * var(--scale)) rgba(0,0,0,0.55)) brightness(1.05);
            }
            .plate .icon-circle {
                border: calc(1.5px * var(--scale)) solid rgba(255,255,255,0.2);
                box-shadow: inset 0 0 calc(5px * var(--scale)) rgba(0,0,0,0.25);
            }
            .name-slot { font-size: calc(8.4px * var(--scale)); letter-spacing: 0.02em; }
            .row-title { font-size: calc(12px * var(--scale)); letter-spacing: 0.1em; padding: 0 6px; }
            .rope {
                border-radius: calc(1.5px * var(--scale)) calc(1.5px * var(--scale)) 0 0;
                margin-bottom: calc(-5px * var(--scale));
                position: relative;
                z-index: 1;
            }
            /* 移动端标签栏：沿用桌面端的水平居中 + 自动换行，只缩小尺寸。
               这里以前写过 flex-start + 横向滚动，标题变短后整排会贴到左边，
               所以不要再覆盖 justify-content / flex-wrap。
               标签行数变多时，高度会被 updateMobileScale 实测并计入 --scale。 */
            .sheet-tabs {
                gap: 4px;
                padding: 4px 6px;
            }
            .sheet-tab {
                font-size: 13px;
                padding: 4px 12px;
                border-width: 1.5px;
            }
            .load-error { font-size: 13px; padding: 18px 12px; }
            .content-area { max-height: none; overflow: visible; padding-bottom: 0; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="header">
            <div class="gold-bar thin"></div>
            <div class="gold-bar title-bar">TaikoNavigation</div>
            <div class="gold-bar thin"></div>
        </header>
        <div class="tabs-bar">
            <nav class="sheet-tabs" id="sheetTabs" role="tablist" aria-label="页面切换" hidden></nav>
        </div>
        <div class="content-area" id="contentArea" role="tabpanel"></div>
        <div class="footer-gold"></div>
    </div>

    <!-- 网页速览弹窗的骨架。内容由脚本按被点击的图板填充；
         放在 .main-container 之外，这样切换工作表重绘导航时弹窗不会受影响。 -->
    <div class="site-modal" id="siteModal" hidden aria-hidden="true"
         role="dialog" aria-modal="true" aria-labelledby="siteModalTab">
        <div class="site-modal-stage">
            <div class="site-modal-main">
                <button type="button" class="site-arrow site-arrow-prev" id="siteArrowPrev"
                        aria-label="上一个网站" title="上一个（←）"></button>
                <div class="site-modal-plate" id="siteModalPlate"></div>
                <div class="site-modal-panel">
                    <div class="site-modal-stripe"></div>
                    <div class="site-modal-stripe stripe-right"></div>
                    <div class="site-modal-head" id="siteModalHead"></div>
                    <div class="site-modal-body">
                        <div class="site-modal-tab" id="siteModalTab">网页速览</div>
                        <div class="site-modal-body-box">
                            <div class="site-modal-cards" id="siteModalCards"></div>
                        </div>
                    </div>
                </div>
                <button type="button" class="site-arrow site-arrow-next" id="siteArrowNext"
                        aria-label="下一个网站" title="下一个（→）"></button>
            </div>
            <p class="site-modal-hint">点击面板以外的空白处退出</p>
        </div>
    </div>

    <script>
        (function() {
            /* data.xlsx 中每个工作表（Sheet）渲染为一个页面。
               每张表的第 1 行为表头，其余行按列读取：name | url | desc | icon | style。
               工作表名即页面标签文字，增删工作表无需改动本文件。
               style 列写 linetitle 的行是"行标题"行：name 列写这一行的标题，
               它同时是强制换行标记——标题单独占一行，其后的链接另起一行排布。 */
            const sheets = [];        // [{ name: 工作表名, sections: [{ title, links: [...] }] }]
            let activeSheet = 0;      // 当前页面的工作表下标
            let lastIsMobile = null;  // 上一次渲染所依据的移动端判定，用于 resize 时决定是否重绘
            const linkStore = {};     // 链接 id -> 链接数据，供"网页速览"弹窗按 id 取用
            let linkSeq = 0;
            let loadError = null;     // 加载失败时给用户看的具体原因（区分"库没加载"和"文件找不到"）

            /* ========== 图标微调偏移量表 ==========
               dx / dy 的单位是"底板基准像素"：脚本会乘以当前 --scale 后写入
               --icon-dx-N / --icon-dy-N，因此移动端在不同屏幕缩放下偏移比例保持一致
               （PC 端 --scale 恒为 1，等价于固定像素）。
               数组下标 0~5 对应底板样式 .plate.style-1 ~ .plate.style-6。
               pc     ：PC 端手工校准值，保持既有渲染结果，请勿随意改动。
               mobile ：移动端数值。初值按"图标圆心在底板中的相对位置不变"由 PC 值换算而来，
                        实际数值用 Ctrl+Shift+P 调试面板量出后替换即可（面板按 O 输出可直接粘贴）。 */
            const DEFAULT_ICON_OFFSETS = {
                pc: [
                    { dx: -0.1, dy: -0.6 },   // style-1
                    { dx: 1.3,  dy: -0.6 },   // style-2
                    { dx: 2.2,  dy: -0.6 },   // style-3
                    { dx: 0.2,  dy: -0.4 },   // style-4
                    { dx: 0.3,  dy: -1.0 },   // style-5
                    { dx: 1.3,  dy: -0.5 }    // style-6
                ],
                mobile: [
                    { dx: -0.1, dy: 0.7 },    // style-1
                    { dx: 0.7,  dy: 0.7 },    // style-2
                    { dx: 1.2,  dy: 0.7 },    // style-3
                    { dx: 0.1,  dy: 0.8 },    // style-4
                    { dx: 0.2,  dy: 0.4 },    // style-5
                    { dx: 0.7,  dy: 0.7 }     // style-6
                ]
            };
            const ICON_OFFSET_STORAGE_KEY = 'taiko.iconOffsets.v1';
            const ICON_OFFSET_LIMIT = 50;   // 单项绝对值上限，避免误操作把图标推出底板
            const iconOffsets = loadIconOffsets();

            function cloneOffsetList(list) {
                return list.map(function(p) { return { dx: p.dx, dy: p.dy }; });
            }

            function normalizeOffset(value, fallback) {
                const num = Number(value);
                if (!isFinite(num)) return fallback;
                return Math.max(-ICON_OFFSET_LIMIT, Math.min(ICON_OFFSET_LIMIT, Math.round(num * 100) / 100));
            }

            /* 读取本地调试缓存（调试面板会把现场校准值存在这里），合并到默认值之上 */
            function loadIconOffsets() {
                const data = {
                    pc: cloneOffsetList(DEFAULT_ICON_OFFSETS.pc),
                    mobile: cloneOffsetList(DEFAULT_ICON_OFFSETS.mobile)
                };
                try {
                    const raw = window.localStorage.getItem(ICON_OFFSET_STORAGE_KEY);
                    if (!raw) return data;
                    const saved = JSON.parse(raw);
                    ['pc', 'mobile'].forEach(function(mode) {
                        const list = saved ? saved[mode] : null;
                        if (!list || typeof list.length !== 'number') return;
                        for (let i = 0; i < data[mode].length; i++) {
                            const item = list[i];
                            if (!item) continue;
                            data[mode][i].dx = normalizeOffset(item.dx, data[mode][i].dx);
                            data[mode][i].dy = normalizeOffset(item.dy, data[mode][i].dy);
                        }
                    });
                } catch (e) {
                    console.warn('读取图标偏移缓存失败，改用默认值', e);
                }
                return data;
            }

            function saveIconOffsets() {
                try {
                    window.localStorage.setItem(ICON_OFFSET_STORAGE_KEY, JSON.stringify(iconOffsets));
                } catch (e) {
                    /* 无痕模式等场景下 localStorage 不可写，忽略即可 */
                }
            }

            /* 当前该用 PC 还是移动端那组数值：与 updateMobileScale / getConfig 同一判定 */
            function iconOffsetMode() {
                return window.innerWidth <= 768 ? 'mobile' : 'pc';
            }

            function currentScaleValue() {
                const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scale'));
                return (isFinite(value) && value > 0) ? value : 1;
            }

            /* 把当前模式下的偏移量（基准像素 × --scale）写进 CSS 变量。
               scale 由 updateMobileScale 传入；不传则读取当前 --scale。 */
            function applyIconOffsets(scale) {
                const s = (typeof scale === 'number' && isFinite(scale) && scale > 0) ? scale : currentScaleValue();
                const list = iconOffsets[iconOffsetMode()];
                const rootStyle = document.documentElement.style;
                for (let i = 0; i < list.length; i++) {
                    rootStyle.setProperty('--icon-dx-' + (i + 1), (Math.round(list[i].dx * s * 1000) / 1000) + 'px');
                    rootStyle.setProperty('--icon-dy-' + (i + 1), (Math.round(list[i].dy * s * 1000) / 1000) + 'px');
                }
            }

            function updateMobileScale() {
                const isMobile = window.innerWidth <= 768;
                lastIsMobile = isMobile;
                const root = document.documentElement;
                if (!isMobile) {
                    root.style.setProperty('--scale', '1');
                    root.style.setProperty('--plate-width', '120px');
                    root.style.setProperty('--plate-height', '252px');
                    root.style.setProperty('--sprite-bg-width', '720px');
                    root.style.setProperty('--sprite-bg-height', '252px');
                    root.style.setProperty('--icon-diameter', '57px');
                    root.style.setProperty('--icon-left', '31.5px');
                    root.style.setProperty('--icon-top', '27px');
                    root.style.setProperty('--rope-width', '6px');
                    root.style.setProperty('--rope-height', '33px');
                    root.style.setProperty('--thin-black-height', '3px');
                    root.style.setProperty('--gold-block-height', '10px');
                    root.style.setProperty('--gold-title-height', '52px');
                    root.style.setProperty('--gold-name-min-height', '36px');
                    root.style.setProperty('--row-title-height', '34px');
                    root.style.setProperty('--gap-h', '14px');
                    applyIconOffsets(1);
                    return;
                }
                const BASE = {
                    plateWidth: 68, plateHeight: 143,
                    iconDiameter: 32, iconLeft: 18, iconTop: 14.5,
                    ropeWidth: 4, ropeHeight: 25,
                    thinBlack: 2.5, goldBlock: 8, titleHeight: 42,
                    nameMinHeight: 28, gapH: 7, ropeMarginBottom: 5,
                    rowTitleHeight: 24,
                };
                const effectiveRope = BASE.ropeHeight - BASE.ropeMarginBottom;
                const rowHeight = BASE.thinBlack + effectiveRope + BASE.plateHeight + BASE.thinBlack + BASE.nameMinHeight + BASE.thinBlack;
                /* 分区行标题会额外占高：按当前页面实际的标题条数计入总高，避免把内容顶出屏幕 */
                const activeData = sheets[activeSheet];
                let titleCount = 0;
                if (activeData && activeData.sections) {
                    for (let i = 0; i < activeData.sections.length; i++) {
                        if (activeData.sections[i].title) titleCount++;
                    }
                }
                const totalContentHeight = 5 * rowHeight + titleCount * BASE.rowTitleHeight;
                const tabBar = document.getElementById('sheetTabs');
                const tabHeight = (tabBar && !tabBar.hidden) ? tabBar.offsetHeight : 0;
                const totalHeaderFooter = BASE.goldBlock + BASE.titleHeight + BASE.goldBlock + tabHeight + BASE.goldBlock;
                const totalHeightBase = totalContentHeight + totalHeaderFooter;
                const totalWidthBase = BASE.plateWidth * 6 + BASE.gapH * 5 + 12;
                const vh = window.innerHeight, vw = window.innerWidth;
                const scaleH = vh / totalHeightBase;
                const scaleW = vw / totalWidthBase;
                const scale = Math.min(scaleH, scaleW, 1.5);

                root.style.setProperty('--scale', scale);
                applyIconOffsets(scale);
                root.style.setProperty('--plate-width', `${BASE.plateWidth * scale}px`);
                root.style.setProperty('--plate-height', `${BASE.plateHeight * scale}px`);
                root.style.setProperty('--sprite-bg-width', `${BASE.plateWidth * 6 * scale}px`);
                root.style.setProperty('--sprite-bg-height', `${BASE.plateHeight * scale}px`);
                root.style.setProperty('--icon-diameter', `${BASE.iconDiameter * scale}px`);
                root.style.setProperty('--icon-left', `${BASE.iconLeft * scale}px`);
                root.style.setProperty('--icon-top', `${BASE.iconTop * scale}px`);
                root.style.setProperty('--rope-width', `${BASE.ropeWidth * scale}px`);
                root.style.setProperty('--rope-height', `${BASE.ropeHeight * scale}px`);
                root.style.setProperty('--thin-black-height', `${BASE.thinBlack * scale}px`);
                root.style.setProperty('--gold-block-height', `${BASE.goldBlock * scale}px`);
                root.style.setProperty('--gold-title-height', `${BASE.titleHeight * scale}px`);
                root.style.setProperty('--gold-name-min-height', `${BASE.nameMinHeight * scale}px`);
                root.style.setProperty('--row-title-height', `${BASE.rowTitleHeight * scale}px`);
                root.style.setProperty('--gap-h', `${BASE.gapH * scale}px`);
            }

            function getConfig() {
                const isMobile = window.innerWidth <= 768;
                return { columns: isMobile ? 6 : 12, defaultRows: isMobile ? 5 : 2, isMobile };
            }

            function escapeHTML(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function createPlateHTML(linkData, index) {
                const hasLink = linkData && linkData.url;
                const styleNum = linkData ? linkData.style : ((index % 6) + 1);
                const iconSrc = linkData && linkData.icon ? 'img/icon/' + linkData.icon : '';
                const name = linkData ? linkData.name : '';
                const isEmpty = !hasLink;
                const plateClass = 'plate style-' + styleNum + (isEmpty ? ' empty-plate' : '');
                let html = '<div class="plate-unit' + (hasLink ? '' : ' empty-unit') + '">';
                html += '<div class="rope"></div>';
                html += '<div class="' + plateClass + '"';
                /* 点图板改为打开"网页速览"弹窗（网址仍可由图板下方的名称直接跳转） */
                if (hasLink) html += ' onclick="window.TAIKO_OPEN_INFO(' + linkData.id + ')" style="cursor:pointer;"';
                html += '>';
                if (hasLink && iconSrc) {
                    html += '<div class="icon-circle"><img src="' + escapeHTML(iconSrc) +
                            '" alt="' + escapeHTML(name) + '" loading="lazy" onerror="this.style.display=\'none\'"></div>';
                }
                html += '</div></div>';
                return html;
            }

            function createNameHTML(linkData) {
                const hasLink = linkData && linkData.url;
                const name = linkData ? linkData.name : '';
                const url = linkData ? linkData.url : '';
                const cls = 'name-slot' + (hasLink ? ' has-link' : ' empty-name');
                let html = '<span class="' + cls + '"';
                if (hasLink) html += ' onclick="window.open(\'' + escapeHTML(url) + '\', \'_blank\')" style="cursor:pointer;"';
                html += '>' + escapeHTML(name) + '</span>';
                return html;
            }

            /* ========== 页面标签 ========== */

            function renderTabs() {
                const tabBar = document.getElementById('sheetTabs');
                if (!tabBar) return;
                if (sheets.length <= 1) {   // 只有一个工作表时无需分页
                    tabBar.hidden = true;
                    tabBar.innerHTML = '';
                    return;
                }
                tabBar.hidden = false;
                tabBar.innerHTML = sheets.map(function(sheet, index) {
                    const on = index === activeSheet;
                    return '<button type="button" class="sheet-tab' + (on ? ' active' : '') +
                           '" role="tab" data-index="' + index +
                           '" aria-controls="contentArea" aria-selected="' + (on ? 'true' : 'false') +
                           '">' + escapeHTML(sheet.name) + '</button>';
                }).join('');
            }

            function updateTabState() {
                const tabBar = document.getElementById('sheetTabs');
                if (!tabBar) return;
                const tabs = tabBar.querySelectorAll('.sheet-tab');
                for (let i = 0; i < tabs.length; i++) {
                    const on = i === activeSheet;
                    tabs[i].classList.toggle('active', on);
                    tabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
                }
            }

            function currentHashName() {
                let raw = window.location.hash || '';
                if (raw.charAt(0) === '#') raw = raw.slice(1);
                try { return decodeURIComponent(raw); } catch (e) { return raw; }
            }

            /* 切换页面：updateHash 为 false 时不再回写地址栏（由 hashchange 触发时使用） */
            function activateSheet(index, updateHash) {
                if (!(index >= 0 && index < sheets.length)) return;
                const changed = index !== activeSheet;
                activeSheet = index;
                updateTabState();
                if (updateHash !== false && currentHashName() !== sheets[index].name) {
                    window.location.hash = '#' + encodeURIComponent(sheets[index].name);
                }
                if (changed) renderAll();   // 行标题条数随页面不同，需要连同移动端缩放一起重算
            }

            /* ========== 页面内容 ========== */

            function renderGrid() {
                const contentArea = document.getElementById('contentArea');
                const sheet = sheets[activeSheet];
                if (!sheet) {
                    contentArea.innerHTML = '<div class="load-error">' +
                        escapeHTML(loadError || '无法加载 data.xlsx，请确认该文件与本页面位于同一目录。') +
                        '</div>';
                    return;
                }
                const config = getConfig();
                const columns = config.columns;
                const defaultRows = config.defaultRows;

                let html = '';
                let rowIndex = 0;      // 跨分区的行号，用于左右交替的入场动画
                sheet.sections.forEach(function(section) {
                    const linksData = section.links;

                    if (!linksData.length) {
                        // 只有标题、没有链接的分区：只画标题条，不占一整行空网格
                        if (section.title) {
                            html += '<div class="row-group">';
                            html += '<div class="black-line"></div>';
                            html += '<div class="row-title-bar"><span class="row-title">' + escapeHTML(section.title) + '</span></div>';
                            html += '<div class="black-line"></div>';
                            html += '</div>';
                        }
                        return;
                    }

                    // 带行标题的分区：换行由标题决定，每行最多 columns 个，不再补齐；
                    // 没有标题的分区（普通工作表）沿用整页补齐 defaultRows 行的老规则
                    const minSlots = section.title
                        ? linksData.length
                        : Math.max(defaultRows * columns, linksData.length);
                    const rows = Math.ceil(minSlots / columns);

                    for (let row = 0; row < rows; row++) {
                        const rowSlots = [];
                        for (let col = 0; col < columns; col++) {
                            const idx = row * columns + col;
                            rowSlots.push(idx < linksData.length ? linksData[idx] : null);
                        }
                        /* 每行都排满 columns 个槽位，空位由暗置底板填满：
                           第一块图板因此落在"正常排列时第一列"的位置，
                           分区行与普通行的排列完全一致。 */
                        const directionClass = (rowIndex % 2 === 0) ? 'row-animate' : 'row-animate-reverse';
                        html += '<div class="row-group">';
                        html += '<div class="black-line"></div>';
                        if (row === 0 && section.title) {      // 行标题只出现在该分区的第一行
                            html += '<div class="row-title-bar"><span class="row-title">' + escapeHTML(section.title) + '</span></div>';
                        }
                        html += '<div class="plates-row ' + directionClass + '">';
                        for (let col = 0; col < columns; col++) html += createPlateHTML(rowSlots[col], rowIndex * columns + col);
                        html += '</div>';
                        html += '<div class="black-line"></div>';
                        html += '<div class="gold-name-row">';
                        for (let col = 0; col < columns; col++) html += createNameHTML(rowSlots[col]);
                        html += '</div>';
                        html += '<div class="black-line"></div>';
                        html += '</div>';
                        rowIndex++;
                    }
                });
                contentArea.innerHTML = html;
            }

            function renderAll() {
                updateMobileScale();
                renderGrid();
            }

            /* ========== 网页速览弹窗 ==========
               点图板不再直接跳转，而是打开这块弹窗：左侧是与图板同款、同图标的 MiniPlate，
               右侧是 Panel.png 面板 —— 顶部放 data.xlsx 里该行的 desc，下方三张
               GaugeCondition_Bar 卡位暂时留空（后续放每个网页的 16:9 预览图）。 */
            const STYLE_COUNT = 6;                 // MiniPlate.png / Panel_Side.png 都是 6 帧精灵图
            const MODAL_STACK_BREAKPOINT = 760;    // 小于这个宽度改成上下堆叠
            /* 挂牌 230 + 面板 1522 + 两个间距 12 + 两个翻页箭头 56 + 两侧额外留白 16×2 */
            const MODAL_STAGE_WIDTH = 1935;
            const MODAL_STAGE_HEIGHT = 800;        // 面板最小高度 770 + 上下留白
            const MODAL_CARD_COUNT = 3;            // 每个网页预留三张 16:9 预览图卡位
            const MODAL_TAB_TEXT = '网页速览';
            const SWIPE_MIN = 45;                  // 滑动翻页的最小水平位移(px)
            /* 弹窗动画速度倍率：写进 :root 的 --modal-speed，CSS 里所有时长都由它换算。
               调试面板（Ctrl+Shift+P）可以实时改，数值缓存在 localStorage。 */
            const MODAL_SPEED_KEY = 'taiko.modalSpeed.v1';
            const MODAL_SPEED_MIN = 0.25;
            const MODAL_SPEED_MAX = 4;
            const MODAL_BASE_SWITCH_MS = 167;      // 切换动画 = 10 帧 @60fps（20 帧的两倍速）
            const MODAL_BASE_PUSH = 1870;          // 推入距离（素材像素），再乘以 --k
            let modalPushDir = 1;                  // +1: 新块从右边推入；-1: 从左推入
            let modalSpeed = loadModalSpeed();
            let modalTargetUrl = '';               // 当前弹窗对应网址，供左侧挂牌点击跳转
            let modalOrder = [];                   // 当前页面（工作表）里链接的顺序，翻页按它走
            let modalPos = -1;                     // 当前弹窗对应 modalOrder 里的下标
            let swipeGuardUntil = 0;               // 刚滑完的一小段时间内忽略 click，避免误触挂牌
            let modalPaging = false;               // 正在推入/推出，动画中新的翻页请求先排队
            let modalPending = 0;                  // 连按攒下的翻页请求，符号表示方向
            let modalClosing = false;              // 正在关闭
            let modalTimer = 0;                    // 翻页/关闭用的定时器

            /* 给每条链接发一个 id：行内 onclick 只带 id，避免把整串网址塞进属性里 */
            function registerLink(item) {
                const id = ++linkSeq;
                item.id = id;
                linkStore[id] = item;
                return item;
            }

            function modalElement() {
                return document.getElementById('siteModal');
            }

            /* ---------- 弹窗动画速度（调试面板可调） ---------- */

            function clampModalSpeed(value) {
                const num = Number(value);
                if (!isFinite(num) || num <= 0) return 1;
                return Math.min(MODAL_SPEED_MAX, Math.max(MODAL_SPEED_MIN, Math.round(num * 100) / 100));
            }

            function loadModalSpeed() {
                let saved = null;
                try { saved = window.localStorage.getItem(MODAL_SPEED_KEY); } catch (e) { /* 无痕模式等 */ }
                return saved === null ? 1 : clampModalSpeed(saved);
            }

            function applyModalSpeed() {
                document.documentElement.style.setProperty('--modal-speed', String(modalSpeed));
            }

            function saveModalSpeed() {
                try { window.localStorage.setItem(MODAL_SPEED_KEY, String(modalSpeed)); } catch (e) { /* 忽略 */ }
            }

            function setModalSpeed(value) {
                modalSpeed = clampModalSpeed(value);
                applyModalSpeed();
                saveModalSpeed();
                return modalSpeed;
            }

            /* JS 里的延时必须跟着 CSS 时长一起缩放，否则调快之后定时器会等太久 */
            function modalSwitchDelay() {
                return Math.round(MODAL_BASE_SWITCH_MS / modalSpeed) + 40;
            }

            applyModalSpeed();

            /* 弹窗整体缩放 --k：桌面端按"挂牌 + 面板"并排算，窄屏只按面板宽度算，
               挂牌另用一个更大的 --pk，免得在手机上缩成一个小点。
               可用宽高直接量弹窗自身（position:fixed + inset:0），比 window.innerWidth
               更可靠：后者在部分移动端/内嵌浏览器里会大于实际可视区域，导致面板溢出。 */
            function updateModalScale() {
                const modal = modalElement();
                if (!modal || modal.hidden) return;
                const stacked = window.innerWidth <= MODAL_STACK_BREAKPOINT;
                const boxW = modal.clientWidth || window.innerWidth;
                const boxH = modal.clientHeight || window.innerHeight;
                const availW = Math.max(160, boxW - (stacked ? 12 : 24));
                const availH = Math.max(240, boxH - (stacked ? 20 : 32));
                let k;
                if (stacked) {
                    k = availW / 1522;
                } else {
                    k = Math.min(availW / MODAL_STAGE_WIDTH, availH / MODAL_STAGE_HEIGHT);
                }
                k = Math.min(Math.max(k, 0.14), 1);
                modal.style.setProperty('--k', String(Math.round(k * 10000) / 10000));
                /* 窄屏挂牌单独放大，但别太大：手机首屏高度有限，挂牌占太多会把卡片挤出屏幕 */
                const pk = stacked ? Math.min(k * 1.8, 0.5) : k;
                modal.style.setProperty('--pk', String(Math.round(pk * 10000) / 10000));
                applyPushVars();
            }

            /* 推入距离直接由 JS 写成 px。
               CSS 里虽然还有 --push: calc(1870px * var(--k)) 兜底，但那条 var() 链在
               "第一次从 display:none 显示出来"时会慢一拍 —— 过渡的起点会取到还没
               应用 --k 的 1870px，手机上（k≈0.24）就等于多跑 4 倍距离。
               这里连 --push-in / --push-out 一起写死，避免再套一层 var()。 */
            function applyPushVars() {
                const modal = modalElement();
                if (!modal) return;
                const k = parseFloat(modal.style.getPropertyValue('--k'));
                const px = MODAL_BASE_PUSH * ((isFinite(k) && k > 0) ? k : 1);
                const inPx = modalPushDir > 0 ? px : -px;
                modal.style.setProperty('--push', px.toFixed(2) + 'px');
                modal.style.setProperty('--push-in', inPx.toFixed(2) + 'px');
                modal.style.setProperty('--push-out', (-inPx).toFixed(2) + 'px');
            }

            function createModalCardHTML() {
                let html = '';
                for (let i = 0; i < MODAL_CARD_COUNT; i++) {
                    html += '<div class="site-modal-card">' +
                            '<div class="site-modal-shot" data-shot="' + (i + 1) + '"></div>' +
                            '</div>';
                }
                return html;
            }

            function prettyHost(url) {
                try { return new URL(url, window.location.href).hostname; } catch (e) { return url; }
            }

            /* 翻页顺序 = 当前选中的那张工作表里链接的排列顺序（与网格渲染顺序一致） */
            function activeSheetLinkIds() {
                const ids = [];
                const sheet = sheets[activeSheet];
                if (sheet) {
                    sheet.sections.forEach(function(section) {
                        section.links.forEach(function(link) { ids.push(link.id); });
                    });
                }
                return ids;
            }

            /* 翻页在单张工作表内循环，所以两个箭头始终可用；
               只有整页只剩一条链接时才把箭头收起来 */
            function updateModalArrows() {
                const modal = modalElement();
                const prev = document.getElementById('siteArrowPrev');
                const next = document.getElementById('siteArrowNext');
                const canPage = modalOrder.length > 1;
                if (modal) modal.classList.toggle('no-paging', !canPage);
                if (prev) prev.disabled = !canPage;
                if (next) next.disabled = !canPage;
            }

            /* 把数据填进弹窗 —— 只换内容，不碰动画状态 */
            function fillSiteModal(data) {
                const modal = modalElement();
                const styleNum = Math.min(Math.max(parseInt(data.style, 10) || 1, 1), STYLE_COUNT);
                const name = data.name || '';
                const url = data.url || '';
                const desc = data.desc || '';
                const iconSrc = data.icon ? 'img/icon/' + data.icon : '';

                /* 翻页位置：按当前工作表的链接顺序算 */
                modalOrder = activeSheetLinkIds();
                modalPos = modalOrder.indexOf(data.id);

                /* 挂牌与左右装饰条都按同一下标取帧（0~5 对应 style-1~6） */
                modal.style.setProperty('--idx', String(styleNum - 1));

                /* 挂牌整块可点：点它就直接打开该网页 */
                modalTargetUrl = url;

                const plate = document.getElementById('siteModalPlate');
                if (plate) {
                    plate.innerHTML = iconSrc
                        ? '<div class="icon-circle"><img src="' + escapeHTML(iconSrc) + '" alt="' +
                          escapeHTML(name) + '" onerror="this.style.display=\'none\'"></div>'
                        : '';
                }

                const head = document.getElementById('siteModalHead');
                if (head) {
                    let html = '<div class="site-modal-title">' + escapeHTML(name || '未命名页面') + '</div>';
                    if (desc) html += '<p class="site-modal-desc">' + escapeHTML(desc) + '</p>';
                    html += '<a class="site-modal-visit" href="' + escapeHTML(url) +
                            '" target="_blank" rel="noopener noreferrer">' +
                            '<span class="site-modal-visit-name">打开网站</span>' +
                            '<span class="site-modal-visit-host">' + escapeHTML(prettyHost(url)) + '</span>' +
                            '</a>';
                    head.innerHTML = html;
                }

                const tab = document.getElementById('siteModalTab');
                if (tab) tab.textContent = MODAL_TAB_TEXT;

                const cards = document.getElementById('siteModalCards');
                if (cards) cards.innerHTML = createModalCardHTML();

                updateModalArrows();
            }

            /* 从入场起点（--push-in 一侧）推入归位 */
            function showSiteModal() {
                const modal = modalElement();
                if (!modal) return;
                modalClosing = false;
                modal.hidden = false;
                modal.classList.remove('closing', 'paging-in');
                removeModalGhost();
                modal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');
                /* 先把尺寸和推入距离算好，这一步要禁掉过渡：
                   否则 --push-in 从"还没算出 --k"的基准值变到正确值这件事本身
                   也会跑一段位移过渡，真正的入场过渡就会从那个错误起点开始
                   （手机上 k≈0.3，等于多跑 3 倍距离、快 3 倍）。 */
                modal.classList.add('paging-snap');
                updateModalScale();
                void modal.offsetHeight;
                modal.classList.remove('paging-snap');
                void modal.offsetHeight;   // 让无过渡的起点落地，入场过渡才从它开始
                modal.classList.add('show');
            }

            /* 打开：从右往左错开一点点淡入（不从屏幕外飞入） */
            function openSiteModal(data) {
                const modal = modalElement();
                if (!modal || !data || !data.url) return;
                window.clearTimeout(modalTimer);
                modalPaging = false;
                modalPending = 0;
                modal.classList.remove('paging', 'paging-snap', 'paging-in');
                removeModalGhost();
                modalPushDir = 1;
                applyPushVars();
                fillSiteModal(data);
                if (modal.hidden || !modal.classList.contains('show')) showSiteModal();
            }

            /* ---------- 翻页的"上一块"叠加层 ----------
               翻页时把当前这块整体克隆一份摆在旁边，和新的那块一起朝同一方向
               平移同样的距离 —— 旧块被推出屏幕，新块推入。
               两块始终隔着一个 --push，互相保持相对静止，就是"推"的感觉，
               全程不改变透明度，不做叠化。 */
            function makeModalGhost() {
                const modal = modalElement();
                const stage = modal && modal.querySelector('.site-modal-stage');
                if (!stage) return null;
                const ghost = document.createElement('div');
                ghost.className = 'site-modal-ghost';
                ghost.setAttribute('aria-hidden', 'true');
                Array.prototype.slice.call(stage.children).forEach(function(child) {
                    ghost.appendChild(child.cloneNode(true));
                });
                /* 克隆里的 id 会和真正那份撞车，去掉（脚本靠 id 找元素） */
                Array.prototype.slice.call(ghost.querySelectorAll('[id]')).forEach(function(el) {
                    el.removeAttribute('id');
                });
                return ghost;
            }

            function removeModalGhost() {
                const modal = modalElement();
                const ghost = modal && modal.querySelector('.site-modal-ghost');
                if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
            }

            /* 左右翻页：delta = -1 上一页 / +1 下一页。
               看下一个 → 新旧两块一起向左平移一个 --push：旧块被推出左边，新块从右边推入；
               看上一个 → 整体反过来。
               顺序在整张工作表内首尾相接：最后一条的下一个回到第一条。
               连按不会丢：正在跑动画时先把请求记下来，跑完接着跑。 */
            function stepSiteModal(delta) {
                const modal = modalElement();
                if (!modal || modal.hidden || modalClosing) return;
                if (modalPos < 0 || modalOrder.length < 2) return;

                modalPending += delta;
                if (modalPaging) return;      // 动画中，先排队
                pumpModalQueue();
            }

            /* 把排队的翻页请求一条条放出来 */
            function pumpModalQueue() {
                if (modalPaging || !modalPending) return;
                const delta = modalPending > 0 ? 1 : -1;
                modalPending -= delta;
                pushModalPage(delta);
            }

            function pushModalPage(delta) {
                const modal = modalElement();
                if (!modal || modal.hidden) return;
                if (modalPos < 0 || modalOrder.length < 2) return;

                const len = modalOrder.length;
                const next = ((modalPos + delta) % len + len) % len;   // 单页内循环
                const data = linkStore[modalOrder[next]];
                if (!data) return;

                modalPaging = true;
                window.clearTimeout(modalTimer);

                /* 方向：新的一块从哪边推入、旧的一块往哪边推出 */
                modalPushDir = delta > 0 ? 1 : -1;
                applyPushVars();

                /* 1) 先把"上一块"摆在旁边（此时 modal 还没加 .paging，它停在起始位置） */
                removeModalGhost();
                const stage = modal.querySelector('.site-modal-stage');
                const ghost = makeModalGhost();
                if (stage && ghost) stage.appendChild(ghost);

                /* 2) 无过渡地把新内容摆到入场起点（屏幕另一侧外面一点） */
                modal.classList.add('paging-snap', 'paging-in');
                fillSiteModal(data);
                void modal.offsetHeight;

                /* 3) 两块同时开跑：旧块推出并淡出到 --push-out，新块推入归位 */
                modal.classList.remove('paging-snap', 'paging-in');
                modal.classList.add('paging');
                void modal.offsetHeight;

                /* 4) 动画结束后收掉叠加层，有排队的就接着跑下一条 */
                modalTimer = window.setTimeout(function() {
                    modalPaging = false;
                    if (modal.hidden) return;
                    modal.classList.remove('paging');
                    removeModalGhost();
                    pumpModalQueue();
                }, modalSwitchDelay());
            }

            function closeSiteModal() {
                const modal = modalElement();
                if (!modal || modal.hidden || modalClosing) return;
                modalClosing = true;
                window.clearTimeout(modalTimer);
                modalPaging = false;
                modalPending = 0;
                modal.classList.remove('paging', 'paging-snap', 'paging-in');
                removeModalGhost();
                modalPushDir = 1;   // 关闭固定向左推出
                applyPushVars();
                modal.classList.remove('show');
                modal.classList.add('closing');
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
                window.setTimeout(function() {
                    if (modal.classList.contains('show')) { modalClosing = false; return; }
                    modal.hidden = true;
                    modal.classList.remove('closing');
                    modalClosing = false;
                }, modalSwitchDelay() + 50);   // 略长于切换动画，避免还没淡完就被抽掉
            }

            /* 供图板的行内 onclick 调用 */
            window.TAIKO_OPEN_INFO = function(id) {
                const data = linkStore[id];
                if (data) openSiteModal(data);
            };

            /* ========== 弹窗调试接口 ==========
               供文件末尾的 Ctrl+Shift+P 面板调"翻页/开合动画速度"；正常浏览时不会被调用。 */
            window.TAIKO_MODAL_DEBUG = {
                storageKey: MODAL_SPEED_KEY,
                min: MODAL_SPEED_MIN,
                max: MODAL_SPEED_MAX,
                get: function() { return modalSpeed; },
                set: setModalSpeed,
                reset: function() { return setModalSpeed(1); },
                isOpen: function() {
                    const modal = modalElement();
                    return !!modal && !modal.hidden;
                },
                /* 试放一次：弹窗没开就打开当前页第一条，已经开着就翻到下一页 */
                preview: function() {
                    const ids = activeSheetLinkIds();
                    if (!ids.length) return false;
                    const modal = modalElement();
                    if (!modal || modal.hidden) {
                        const first = linkStore[ids[0]];
                        if (!first) return false;
                        openSiteModal(first);
                        return true;
                    }
                    stepSiteModal(1);
                    return true;
                }
            };

            const modalRoot = modalElement();
            if (modalRoot) {
                /* 除面板、挂牌与翻页箭头以外，点哪儿都退出 —— 与底部提示文字的说法保持一致
                   （只判 e.target === modalRoot 的话，面板与挂牌之间那条窄缝点了没反应）。 */
                modalRoot.addEventListener('click', function(e) {
                    if (Date.now() < swipeGuardUntil) return;   // 刚滑动完，忽略尾随的 click
                    const t = e.target;
                    if (t && t.closest && (t.closest('.site-modal-panel') ||
                                           t.closest('.site-modal-plate') ||
                                           t.closest('.site-arrow'))) return;
                    closeSiteModal();
                });

                const modalPlate = document.getElementById('siteModalPlate');
                if (modalPlate) {
                    /* 点挂牌 = 直接访问该网页（与图板下方名称的跳转行为一致） */
                    modalPlate.addEventListener('click', function() {
                        if (Date.now() < swipeGuardUntil) return;
                        if (modalTargetUrl) window.open(modalTargetUrl, '_blank');
                    });
                }

                const arrowPrev = document.getElementById('siteArrowPrev');
                const arrowNext = document.getElementById('siteArrowNext');
                if (arrowPrev) arrowPrev.addEventListener('click', function() { stepSiteModal(-1); });
                if (arrowNext) arrowNext.addEventListener('click', function() { stepSiteModal(1); });

                /* ---------- 左右滑动翻页 ----------
                   只在位移足够大、且明显偏水平时才翻页，
                   否则会和弹窗自身的纵向滚动打架。 */
                let touchX = 0, touchY = 0, touching = false;
                modalRoot.addEventListener('touchstart', function(e) {
                    if (e.touches.length !== 1) { touching = false; return; }
                    touching = true;
                    touchX = e.touches[0].clientX;
                    touchY = e.touches[0].clientY;
                }, { passive: true });

                modalRoot.addEventListener('touchend', function(e) {
                    if (!touching) return;
                    touching = false;
                    const t = e.changedTouches && e.changedTouches[0];
                    if (!t) return;
                    const dx = t.clientX - touchX;
                    const dy = t.clientY - touchY;
                    if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.4) return;
                    swipeGuardUntil = Date.now() + 420;
                    stepSiteModal(dx < 0 ? 1 : -1);   // 往左滑看下一个
                }, { passive: true });
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' || e.key === 'Esc') { closeSiteModal(); return; }
                const modal = modalElement();
                if (!modal || modal.hidden) return;
                if (e.key === 'ArrowLeft') { e.preventDefault(); stepSiteModal(-1); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); stepSiteModal(1); }
            });

            /* ========== 工作表 -> 分区 ========== */

            /* style 列写 linetitle 的行为"行标题"行（不区分大小写，允许前后空格） */
            function isLineTitleRow(styleValue) {
                const text = (styleValue === null || styleValue === undefined) ? '' : String(styleValue);
                return text.trim().toLowerCase() === 'linetitle';
            }

            /* 把一张工作表切成若干分区：每个分区 = 一个行标题（可为空）+ 该标题下的链接。
               遇到 linetitle 行就强制收尾当前行，并开一个新分区。 */
            function parseSections(rows) {
                const sections = [];
                let current = { title: null, links: [] };
                sections.push(current);
                for (let i = 1; i < rows.length; i++) {          // 第 1 行为表头
                    const row = rows[i];
                    if (!row || row.length === 0) continue;
                    const name = (row[0] === null || row[0] === undefined) ? '' : String(row[0]);
                    const url = (row[1] === null || row[1] === undefined) ? '' : String(row[1]);
                    if (isLineTitleRow(row[4])) {                // 行标题：同时是强制换行标记
                        current = { title: name.trim(), links: [] };
                        sections.push(current);
                        continue;
                    }
                    if (!name && !url) continue;                 // 跳过空行
                    current.links.push(registerLink({
                        name: name,
                        url: url,
                        desc: row[2] || '',
                        icon: row[3] || '',
